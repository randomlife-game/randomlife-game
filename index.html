  .fact{margin-top:16px;text-align:left;background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;animation:rise .4s ease both;word-break:keep-all}

  /* 출생 신고서 */

  .resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px 12px 16px;margin:0 0 20px;background:var(--card)}

  .lv-a{flex:none;min-width:52px;font-weight:900}.lv-a b{font-size:24px}.lv-a small{font-size:12px;margin-left:1px}

  .lv-b span,.lv-b small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.45}.lv-b small{color:var(--mute);margin-top:3px}

  .cmp table{width:100%;border-collapse:collapse;font-size:14px}

  .mock.tw{border-color:var(--cmp);color:var(--cmp)}

  .at-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink2)}

  .bdg small{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
  .astrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-6px 0 20px}
  .astrip>span{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid var(--rule2);background:var(--card);animation:rise .5s ease both}

  body.px .bdg,body.px .bdg .em,body.px .at-big>div,body.px .astrip>span,body.px .bdg .pb{border-radius:0}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

  @keyframes bob{50%{transform:translateY(-3px)}}
  .rise{animation:rise .35s ease both}

<h1>랜덤인생게임: 같은 날 태어나도 문이 달라요</h1>
<p>같은 날, 같은 성별로, 정반대 형편에서 태어난 두 아이의 일생을 5분 동안 나란히 살아 보는 무료 웹 게임이에요. 어느 나라에서 태어날지는 그해 나라별 출생 수 통계에 따라 정해지고, 선택지마다 다른 아이에게는 그 문이 열렸는지 닫혔는지 보여 줘요. 가입 없이 한국어, 영어, 일본어, 중국어로 할 수 있어요.</p>
<h2 lang="en">Random Life: born the same day, different doors</h2>
<p lang="en">A free five-minute web game where you live two lives side by side: two children born on the same day, at opposite ends of the world's fortunes. Where you are born follows real birth statistics, and every choice shows whether that door was open for the other child.</p>
<h2 lang="ja">ランダム人生：同じ日に生まれても、扉は違う</h2>
<p lang="ja">同じ日に正反対の境遇で生まれた二人の一生を、5分で並べて生きる無料のウェブゲーム。生まれる国は実際の出生数の統計で決まります。</p>
<h2 lang="zh">随机人生：同一天出生，命运之门却不同</h2>
<p lang="zh">一款免费的网页游戏：用五分钟并肩过完同一天出生、境遇相反的两个孩子的一生。出生地按真实的各国出生人数统计决定。</p>
<p>이 게임은 자바스크립트를 켜야 할 수 있어요. · Please enable JavaScript to play.</p>

  while(out.length<n&&pool.length){
    const tot=pool.reduce((s,x)=>s+wf(x),0);let x=rf()*tot,i=0;

  t:["일곱 살이 가까워 옵니다. 학교는 걸어서 한 시간 거리이고, 일손이 필요한 집안 사정도 있습니다.","You are nearing seven. School is an hour's walk away, and your family needs every pair of hands.","七歳が近づいてきました。学校は歩いて一時間の距離で、家には人手も必要です。","你快七岁了。学校要走一个小时，家里也需要人手。"],
  ch:[{l:["학교에 다닌다","Go to school","学校に通う","去上学"],fx:{e:12,j:3},res:["글을 읽고 쓰기 시작했습니다.","You began to read and write.","読み書きを覚え始めました。","你开始识字写字了。"]},
      {l:["가족 일을 돕는다","Help with the family work","家の仕事を手伝う","帮家里干活"],fx:{w:6,e:-6,r:4},res:["일찍 철이 들었습니다. 학교는 띄엄띄엄 다닙니다.","You grew up early. School comes only now and then.","早くに大人びました。学校にはときどきしか行けません。","你早早懂事了，学校只能断断续续地去。"]}]},
 {s:1,
  t:G=>{const n=G.pjob.n;return[`${n[0]} 일을 하는 부모님이 가끔 아이를 어떻게 키울지 다툽니다.`,`Your parents (work: ${n[1]}) sometimes argue about how to raise you.`,`${n[2]}として働く両親が、ときどき子育てのことで言い争います。`,`做${n[3]}的父母，偶尔会为怎么养育你而争执。`]},
  ch:[{l:["조용히 방에서 책을 읽는다","Read quietly in your room","部屋で静かに本を読む","在房间里安静地读书"],fx:{e:6,j:-2},res:["책이 가장 가까운 친구가 됐습니다.","Books became your closest friends.","本がいちばん身近な友だちになりました。","书成了你最亲近的朋友。"]},
      {l:["밖에서 동네 친구들과 논다","Go out and play with the neighborhood kids","外で近所の友だちと遊ぶ","出去和邻居小孩玩"],fx:{r:8,h:3},res:["동네에서 대장 노릇을 했습니다.","You became the leader of the neighborhood.","近所のガキ大将になりました。","你成了街坊小孩里的头儿。"]}]},
 {s:1,ok:G=>G.famTier<=1,
  t:["심하게 열이 오릅니다.","You run a dangerously high fever.","ひどい熱が出ます。","你烧得很厉害。"],
  ch:[{l:["병원에 간다","Go to the hospital","病院に行く","去医院"],req:G=>!(poor(G)&&G.c[4]===0),why:["가까운 병원도, 낼 돈도 없어요","There is no nearby hospital, and no money","近くに病院もなく、お金もありません","附近没有医院，也没有钱"],fx:{h:4,w:-6},
       res:G=>pk(G,["먼 거리를 업혀서 갔고, 돈이 많이 들었지만 나았습니다.","You were carried a long way, and it cost a lot, but you recovered.","遠い道のりを背負われて行き、お金はかかりましたが回復しました。","被人背着走了很远，花了不少钱，但你好转了。"],["치료를 받고 곧 나았습니다.","You were treated and soon recovered.","治療を受けて、すぐに回復しました。","你接受了治疗，很快痊愈。"]),
       risk:{p:G=>poor(G)&&lowInc(G)?0.08:0.01,die:"inf"}},
      {l:["집에서 버틴다","Tough it out at home","家で耐える","在家硬扛"],fx:{h:-5},res:["며칠 앓고 겨우 일어났습니다.","After a few days of suffering, you finally got up.","数日寝込んで、やっと起き上がれました。","病了几天，总算爬了起来。"],risk:{p:G=>poor(G)&&lowInc(G)?0.25:0.05,die:"inf"}},
      {l:["이웃에게 도움을 구한다","Ask a neighbor for help","近所の人に助けを求める","向邻居求助"],fx:{r:6,h:1},res:["이웃이 약과 죽을 나눠 주었습니다.","A neighbor shared medicine and porridge.","近所の人が薬とお粥を分けてくれました。","邻居分给你药和粥。"],risk:{p:G=>0.15,die:"inf"}}]},
 {s:1,ok:G=>G.famTier>=1,
  t:["전학을 가게 됐습니다. 낯선 교실의 첫날.","You are transferring schools. The first day in an unfamiliar classroom.","転校することになりました。見知らぬ教室での初日。","你要转学了，在陌生教室的第一天。"],
  ch:[{l:["먼저 말을 건다","Speak up first","自分から話しかける","主动搭话"],fx:{r:9,j:2},res:["금방 친구가 생겼습니다.","You quickly made friends.","すぐに友だちができました。","你很快交到了朋友。"]},
      {l:["눈치를 보며 지낸다","Keep a low profile","様子をうかがって過ごす","察言观色地待着"],fx:{r:-2,e:3},res:["조용히 적응했습니다.","You adjusted quietly.","静かに馴染んでいきました。","你悄悄地适应了。"]}]},
 {s:1,ok:G=>rich(G),
  t:["생일에 가족이 작은 파티를 열어 줍니다.","Your family throws you a small birthday party.","誕生日に家族が小さなパーティーを開いてくれます。","生日那天，家人为你办了个小派对。"],
  ch:[{l:["기쁘게 즐긴다","Enjoy it with joy","楽しむ","开心地享受"],fx:{j:7,r:4},res:["오래 기억에 남을 하루였습니다.","It was a day you would remember for a long time.","いつまでも心に残る一日でした。","那是难忘的一天。"]},
      {l:["장난감보다 책을 부탁한다","Ask for books instead of toys","おもちゃより本をお願いする","要书不要玩具"],fx:{e:6,j:2},res:["책 몇 권이 세계를 넓혀 줬습니다.","A few books widened your world.","数冊の本が世界を広げてくれました。","几本书拓宽了你的世界。"]}]},
 {s:1,ok:G=>!G.dr.water,
  t:["마을에는 수도가 없어 매일 물을 길어 와야 합니다.","There is no tap in the village, so water has to be fetched every day.","村には水道がなく、毎日水を汲みに行かなければなりません。","村里没有自来水，每天都得去打水。"],
  ch:[{l:["아침마다 물동이를 나른다","Carry water every morning","毎朝水がめを運ぶ","每天早上挑水"],fx:{h:-2,r:5,e:-3},res:["하루의 첫 일과가 물 나르기였습니다.","Fetching water was the first task of every day.","一日の最初の仕事は水汲みでした。","打水成了每天的第一件事。"]},
      {l:["마을 어른들의 우물 모임에 따라간다","Tag along to the elders' gathering at the well","村の大人たちの井戸端の集まりについて行く","跟着村里大人去井边聚会"],fx:{r:7,e:2},res:["어른들의 이야기를 곁에서 들었습니다.","You listened to the grown-ups' stories.","大人たちの話をそばで聞きました。","你在一旁听大人们讲故事。"]}]},
 {s:1,ok:G=>!lowInc(G),
  t:["방과 후에 무엇을 할지 고릅니다.","You choose what to do after school.","放課後に何をするか選びます。","你选择放学后做什么。"],
  ch:[{l:["학원에 다닌다","Go to cram school","塾に通う","去上补习班"],req:G=>G.s.w>=40,why:["학원비가 필요해요","It costs tuition money","塾の月謝が必要です","需要补习费"],fx:{e:10,j:-3,w:-4},res:["공부 습관이 일찍 잡혔습니다.","You built study habits early.","勉強の習慣が早くから身につきました。","你早早养成了学习习惯。"]},
      {l:["도서관에서 책을 빌려 읽는다","Borrow and read books at the library","図書館で本を借りて読む","在图书馆借书读"],fx:{e:6,j:3},res:["도서관이 놀이터가 됐습니다.","The library became your playground.","図書館が遊び場になりました。","图书馆成了你的游乐场。"]},
      {l:["친구들과 뛰어논다","Run around with friends","友だちと駆け回る","和朋友疯玩"],fx:{r:8,h:3,e:-1},res:["해가 질 때까지 놀았습니다.","You played until sunset.","日が暮れるまで遊びました。","你玩到太阳落山。"]}]},
 {s:1,ok:G=>G.sibs>0,
  t:["동생이 태어났습니다.","A younger sibling is born.","弟か妹が生まれました。","弟弟或妹妹出生了。"],
  ch:[{l:["동생을 열심히 돌본다","Look after the baby eagerly","弟妹を一生懸命世話する","认真照顾弟妹"],fx:{r:8,j:3,e:-2},res:["든든한 형 누나가 됐습니다.","You became a dependable older sibling.","頼もしい兄や姉になりました。","你成了可靠的哥哥姐姐。"]},
      {l:["내 몫을 지키려 투정을 부린다","Throw tantrums to protect your share","自分の分を守ろうとわがままを言う","为了守住自己那份而耍脾气"],fx:{r:-3,j:2},res:["한동안 집안이 시끄러웠습니다.","The house was noisy for a while.","しばらく家の中が騒がしくなりました。","家里吵闹了一阵子。"]}]},
 /* 청소년기 */
 {s:2,a0:15,
  t:G=>pk(G,["학교에서 진로 이야기가 나옵니다. 주변에는 일찍 일터로 가는 아이도 많습니다.","Talk of the future comes up at school. Many kids around you head to work early.","学校で進路の話が出ます。周りには早くから働きに出る子も多くいます。","学校里开始谈论前途。你身边不少孩子很早就去干活了。"],["학교에서 진로 이야기가 나옵니다. 성적과 학원 이야기가 한창입니다.","Talk of the future comes up at school. Grades and cram schools are all anyone discusses.","学校で進路の話が出ます。成績や塾の話題でもちきりです。","学校里开始谈论前途，成绩和补习班是热门话题。"]),
  ch:[{l:["공부에 매달린다","Throw yourself into studying","勉強に打ち込む","埋头苦读"],fx:{e:14,h:-4,j:-3},res:["성적은 올랐지만 몸과 마음이 지쳤습니다.","Your grades rose, but body and mind wore out.","成績は上がりましたが、心身が疲れ果てました。","成绩上去了，身心却疲惫不堪。"]},
      {l:["기술을 배우며 일을 시작한다","Start working while learning a trade","技術を学びながら働き始める","边学手艺边开始工作"],fx:{w:8,e:4,r:3},res:["일찍 손에 익은 기술이 생겼습니다.","You picked up a skill early on.","早くから身についた技術ができました。","你早早练就了一门手艺。"]},
      {l:["균형 있게 지낸다","Keep a balance","バランスよく過ごす","保持平衡"],fx:{e:6,j:5,r:4},res:["무난한 청소년기를 보냈습니다.","You had an uneventful adolescence.","無難な思春期を過ごしました。","你度过了平稳的青少年时期。"]},
      {l:["해외 대학에 지원한다","Apply to a university abroad","海外の大学に出願する","申请海外大学"],req:G=>G.famTier>=2||G.s.e>=75,why:["학비와 입학 정보가 있어야 열려요","It takes tuition money and admission know-how","学費と入学情報が必要です","需要学费和入学信息"],fx:{e:16,w:-6,r:-4},res:["낯선 나라의 캠퍼스를 꿈꾸게 됐습니다.","You started dreaming of a campus in a faraway country.","見知らぬ国のキャンパスを夢見るようになりました。","你开始向往异国的校园。"]}]},
 {s:2,ok:G=>G.famTier<=2&&luck(G,31)<0.6,
  t:["집안 사정이 갑자기 어려워졌습니다.","Your family's circumstances suddenly turn hard.","家の事情が急に厳しくなりました。","家里的境况忽然变得艰难。"],
  ch:[{l:["학업을 잠시 접고 일한다","Set school aside and go to work","学業をいったん諦めて働く","暂时放下学业去打工"],fx:{w:10,e:-8,j:-4},res:["가족을 위해 일터로 나갔습니다.","You went to work for your family.","家族のために働きに出ました。","你为了家人走进了工地和店铺。"]},
      {l:["장학금과 친척 도움을 알아본다","Look into scholarships and help from relatives","奨学金や親戚の助けを探す","打听奖学金和亲戚的帮助"],fx:{e:5,w:-2,r:3},res:["어렵게 학교를 이어 갔습니다.","You managed to stay in school, barely.","苦労しながら学校を続けました。","你艰难地把书念了下去。"],risk:{p:G=>0.35,fx:{e:-8,j:-4},res:["도움은 닿지 않았고 결국 학업을 중단했습니다.","Help never came, and you left school in the end.","助けは届かず、結局学業を中断しました。","帮助没能到来，你最终还是辍学了。"]}}]},
 {s:2,
  t:["처음으로 마음이 가는 사람이 생겼습니다.","For the first time, someone catches your heart.","初めて、気になる人ができました。","你第一次有了心动的人。"],
  ch:[{l:["용기 내어 고백한다","Gather your courage and confess","勇気を出して告白する","鼓起勇气表白"],fx:{r:7,j:6},res:["결과가 어떻든 잊지 못할 경험이 됐습니다.","Whatever the result, it became an unforgettable experience.","結果がどうあれ、忘れられない経験になりました。","不论结果如何，这都成了难忘的经历。"],risk:{p:G=>0.4,fx:{j:-8,r:-3},res:["거절당해 한동안 마음이 쓰렸습니다.","You were turned down and hurt for a while.","断られて、しばらく胸が痛みました。","你被拒绝了，难过了好一阵子。"]}},
      {l:["혼자 마음에 담아 둔다","Keep it to yourself","一人で胸にしまっておく","把心意藏在心里"],fx:{j:-1,e:3},res:["일기장에만 이름을 적었습니다.","You wrote the name only in your diary.","名前は日記にだけ書きました。","你只在日记里写下了那个名字。"]}]},
 {s:2,
  t:["또래들이 위험한 일탈을 함께 하자고 합니다.","Your peers invite you to join in something risky.","同世代の子たちが危ない悪ふざけに誘います。","同龄人邀你一起做危险的出格事。"],
  ch:[{l:["함께 어울린다","Join them","一緒に加わる","一起去"],fx:{r:6,j:5,h:-5},res:["짜릿했지만 후폭풍이 따랐습니다.","It was thrilling, but there were consequences.","スリルはありましたが、後で痛い目を見ました。","很刺激，但随后付出了代价。"],risk:{p:G=>0.25,fx:{h:-10,e:-8},res:["사고가 나 크게 다쳤습니다.","There was an accident and you were badly hurt.","事故が起きて大けがをしました。","出了事故，你受了重伤。"]}},
      {l:["거절한다","Refuse","断る","拒绝"],fx:{r:-4,e:4},res:["친구 몇 명을 잃었지만 자신을 지켰습니다.","You lost a few friends but protected yourself.","友だちを何人か失いましたが、自分を守りました。","你失去了几个朋友，却守住了自己。"]}]},
 {s:2,
  t:G=>{const n=nmA(G);return pk(G,[`${n[0]}에서는 학교가 멀고 시설이 부족해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, schools are far and poorly equipped, so choices are hard. You consider going on to higher school.`,`${n[2]}では学校が遠く設備も足りず、選択は簡単ではありません。進学を考えます。`,`在${n[3]}，学校远、设施少，选择并不容易。你考虑继续升学。`],[`${n[0]}에서는 입시 경쟁이 치열해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, entrance competition is fierce, so choices are hard. You prepare to go on to higher school.`,`${n[2]}では受験競争が激しく、選択は簡単ではありません。進学を準備します。`,`在${n[3]}，升学竞争激烈，选择并不容易。你准备继续升学。`])},
  ch:[{l:["끝까지 도전한다","Go for it to the end","最後まで挑戦する","拼到最后"],fx:{e:12,j:-3,w:-4},res:["고생 끝에 진학의 문턱에 닿았습니다.","After much hardship, you reached the threshold of further study.","苦労の末、進学の入り口にたどり着きました。","历经辛苦，你摸到了升学的门槛。"],risk:{p:G=>poor(G)?0.45:0.2,fx:{e:-2,j:-6},res:["원하는 곳에 가지 못해 낙담했습니다.","You didn't get into the place you wanted and felt crushed.","希望の進学先に行けず、落ち込みました。","没能进入想去的学校，你很沮丧。"]}},
      {l:["현실적인 길을 택한다","Take the realistic path","現実的な道を選ぶ","选择现实的路"],fx:{w:6,e:3},res:["안정적인 직업 훈련 쪽으로 방향을 잡았습니다.","You steered toward stable vocational training.","安定した職業訓練の方へ舵を切りました。","你转向了稳妥的职业培训。"]}]},
 {s:2,ok:G=>G.year+14>=1998,
  t:["세상과 연결된 화면 하나가 생겼습니다.","A screen that connects you to the world comes into your life.","世界とつながる画面が一つ手に入りました。","你有了一块连接世界的屏幕。"],
  ch:[{l:["온라인 강의를 듣는다","Take online lessons","オンライン講義を受ける","听网课"],req:G=>G.dr.net||G.s.w>=60,why:["기기와 안정적인 인터넷이 필요해요","It takes a device and a stable connection","端末と安定したネット回線が必要です","需要设备和稳定的网络"],fx:{e:10,j:2},res:["집에서도 먼 세계의 수업을 들었습니다.","From home, you sat in classes from distant places.","家にいながら遠い世界の授業を受けました。","你在家就听到了远方世界的课。"]},
      {l:["친구 휴대폰으로 잠깐씩 본다","Borrow a friend's phone for short looks","友だちの携帯を借りて少しだけ見る","借朋友的手机偶尔看看"],fx:{e:3,r:4},res:["짧은 시간이었지만 많은 걸 알게 됐습니다.","The time was short, but you learned a lot.","短い時間でしたが、多くのことを知りました。","时间虽短，你却学到了很多。"]},
      {l:["책과 필기만으로 공부한다","Study with only books and notes","本とノートだけで勉強する","只靠书和笔记学习"],fx:{e:5,h:1},res:["느리지만 꾸준히 쌓았습니다.","It was slow, but you built it up steadily.","遅くても着実に積み上げました。","虽然慢，却一点点稳稳积累。"]}]},
 {s:2,ok:G=>G.s.e>=40,
  t:["학교에서 큰 대회와 교류 프로그램 소식이 들려옵니다.","News of a big competition and an exchange program reaches your school.","学校に大きな大会と交流プログラムの知らせが届きます。","学校传来了大型比赛和交流项目的消息。"],
  ch:[{l:["교환학생으로 떠난다","Leave as an exchange student","交換留学生として旅立つ","去做交换生"],req:G=>G.s.w>=60,why:["체류 비용을 댈 수 있어야 해요","It takes money to live abroad","滞在費を出せることが必要です","需要付得起在外生活的费用"],fx:{e:12,r:-4,j:6},res:["다른 나라의 교실에서 한 해를 보냈습니다.","You spent a year in a classroom in another country.","他の国の教室で一年を過ごしました。","你在另一个国家的教室里度过了一年。"]},

 {s:3,

 {s:3,
  t:["몸이 보내는 이상 신호가 느껴집니다.","Your body sends worrying signals.","体が異変のサインを送ってきます。","你的身体发出了异常的信号。"],

 {s:3,ok:G=>G.s.e>=45,
  t:["큰 기회가 찾아옵니다. 해외 연수·장학·이민 중 하나입니다.","A big chance arrives: overseas training, a scholarship, or emigration.","大きなチャンスが訪れます。海外研修、奨学金、移住のいずれかです。","一个大机会出现了：海外研修、奖学金或移民。"],
  ch:[{l:["붙잡는다","Grab it","つかみ取る","抓住它"],fx:{e:10,w:8,r:-5},res:["세상이 훨씬 넓어졌습니다.","Your world grew much wider.","世界がずっと広がりました。","世界一下子宽阔了许多。"]},
      {l:["가족 곁에 남는다","Stay near your family","家族のそばに残る","留在家人身边"],fx:{r:8,j:3},res:["익숙한 사람들 곁이 편했습니다.","Being among familiar people felt right.","慣れ親しんだ人たちのそばは心地よいものでした。","待在熟悉的人身边令人安心。"]}]},
 {s:3,pri:1,ok:G=>warIn(G,19,29).l>0,
  t:["분쟁과 불안이 사회를 뒤흔듭니다.","Conflict and unrest shake society.","紛争と不安が社会を揺さぶります。","冲突与动荡撼动着社会。"],

      {l:["버티며 일상을 지킨다","Stay and hold onto daily life","耐えて日常を守る","留下来守住日常"],fx:{j:-4,r:6},res:["이웃과 서로 의지했습니다.","You leaned on your neighbors and they on you.","隣人と支え合いました。","你和邻居们互相依靠。"],risk:{p:G=>0.18,fx:{h:-18},res:["크게 다쳤습니다.","You were badly hurt.","大けがをしました。","你受了重伤。"],die:"war"}}]},
 {s:3,
  t:["독립해서 살 곳을 구해야 합니다.","You need to find a place of your own.","独り立ちして住む場所を探さなければなりません。","你得找个自己的住处了。"],

      {l:["가족이 보증금을 대 준다","Your family covers the deposit","家族が保証金を出してくれる","家人替你付押金"],req:G=>G.famTier>=2,why:["보증금을 댈 사람이 있어야 해요","Someone has to be able to pay the deposit","保証金を出してくれる人が必要です","需要有人能替你付押金"],fx:{w:6,j:4},res:["좋은 동네에서 출발했습니다.","You started out in a good neighborhood.","良い街でスタートを切りました。","你从一个好社区起步。"]},
      {l:["친구들과 방 하나를 나눠 쓴다","Share one room with friends","友だちと一部屋をシェアする","和朋友合住一间房"],fx:{r:8,w:-1,j:-1},res:["북적이지만 외롭지 않았습니다.","It was crowded, but you were never lonely.","騒がしいけれど、寂しくはありませんでした。","虽然拥挤，却并不孤单。"]}]},
 {s:3,
  t:["작게라도 내 일을 시작할 기회가 보입니다.","You see a chance to start something of your own, however small.","小さくても自分の事業を始めるチャンスが見えます。","你看到了哪怕再小也能自己创业的机会。"],

      {l:["동료들과 작은 모임으로 시작한다","Start small with a group of peers","仲間と小さな集まりから始める","和同伴从小组起步"],fx:{r:8,w:3},res:["적은 돈으로 조금씩 키워 갔습니다.","You grew it bit by bit on little money.","わずかなお金で少しずつ育てていきました。","你用很少的钱一点点把它做大。"]},
      {l:["월급 생활에 만족한다","Be content with a steady wage","月給暮らしに満足する","满足于领薪水的生活"],fx:{w:4,j:2},res:["안정이 가장 큰 자산이었습니다.","Stability was your greatest asset.","安定が最大の財産でした。","安稳就是你最大的财富。"]}]},

 {s:4,
  t:["아이를 키우며 살림이 빠듯해집니다.","Raising a child, your household budget grows tight.","子育てをしながら、家計が苦しくなります。","养孩子让家里的开销变得紧巴巴。"],

 {s:4,
  t:["직장·사업에서 큰 결정을 해야 합니다.","A major decision awaits you at work or in business.","仕事や事業で大きな決断を迫られます。","你在工作或生意上必须做出重大决定。"],

      {l:["안정을 택한다","Choose stability","安定を選ぶ","选择稳妥"],fx:{w:5,j:1},res:["큰 변화 없이 흘러갔습니다.","Things went on without big changes.","大きな変化なく過ぎていきました。","日子没有大变化地过去了。"]}]},
 {s:4,
  t:["부모님이 아프십니다.","Your parents fall ill.","両親が病気になりました。","父母病倒了。"],

 {s:4,
  t:["예상치 못한 큰 사건이 닥칩니다.","An unexpected, major event strikes.","予想外の大きな出来事が襲いかかります。","一件意想不到的大事降临了。"],

      {l:["혼자 해결하려 한다","Try to handle it alone","一人で解決しようとする","想独自解决"],fx:{h:-5,j:-3,w:2},res:["스스로 버텨 냈지만 지쳤습니다.","You pulled through alone, but you were worn out.","自力で乗り切りましたが、疲れ果てました。","你独自撑了过来，却精疲力竭。"]}]},
 {s:4,ok:G=>G.s.h<70,
  t:["몸과 마음이 번아웃에 빠집니다.","Body and mind sink into burnout.","心身が燃え尽きてしまいます。","身心陷入了倦怠。"],
  ch:[{l:["휴식을 취한다","Take a rest","休息をとる","好好休息"],req:G=>G.s.w>=30||G.c[4]>=3,why:["쉬면 생계가 끊겨요","Resting means losing your income","休めば生活が成り立ちません","一休息生计就断了"],fx:{h:8,j:7,w:-5},res:["잠시 멈춘 덕에 다시 걸을 힘이 생겼습니다.","Pausing gave you the strength to walk again.","少し立ち止まったおかげで、また歩く力が湧きました。","停一停，让你重新有了走下去的力气。"]},
      {l:["계속 달린다","Keep running","走り続ける","继续硬撑"],fx:{w:6,h:-9},res:["성과는 났지만 몸이 상했습니다.","You got results, but your body paid for it.","成果は出ましたが、体を壊しました。","成绩有了，身体却垮了。"],risk:{p:G=>0.08,fx:{h:-15},res:["쓰러져 병원에 실려 갔습니다.","You collapsed and were taken to the hospital.","倒れて病院に運ばれました。","你倒下了，被送进医院。"]}}]},
 {s:4,
  t:["아이의 교육 방향을 정해야 합니다.","You must decide how your child will be educated.","子どもの教育方針を決めなければなりません。","你得决定孩子的教育方向。"],
  ch:[{l:["사교육과 유학까지 지원한다","Pay for extra tutoring, even study abroad","塾や留学まで支援する","支持课外辅导甚至留学"],req:G=>G.s.w>=60,why:["감당할 비용이 필요해요","It takes money you can afford","負担できる費用が必要です","需要负担得起的费用"],fx:{w:-12,r:3,e:3},res:["아이에게 더 넓은 길을 열어 주었습니다.","You opened a wider road for your child.","子どもにより広い道を開いてあげました。","你为孩子打开了更宽的路。"]},
      {l:["동네 학교에 보내고 곁에서 돌본다","Send them to the local school and stay close","地元の学校に通わせてそばで見守る","送去附近的学校，在身边陪着"],fx:{r:8,j:4},res:["평범하지만 따뜻한 성장기를 보냈습니다.","They had an ordinary but warm childhood.","平凡だけれど温かい成長期を過ごしました。","孩子度过了平凡却温暖的成长期。"]},
      {l:["일을 줄이고 직접 가르친다","Cut back work and teach them yourself","仕事を減らして自分で教える","减少工作，亲自教孩子"],fx:{r:9,w:-6,e:3},res:["아이와의 시간이 길어졌습니다.","You spent far more time with your child.","子どもと過ごす時間が長くなりました。","你陪孩子的时间变长了。"]}]},
 {s:4,
  t:["동네에 닥친 문제를 두고 사람들이 모입니다.","People gather over a problem facing the neighborhood.","地域に降りかかった問題をめぐって人々が集まります。","人们为社区面临的问题聚在一起。"],

 {s:5,
  t:["건강에 빨간불이 켜졌습니다.","Your health sets off a red light.","健康に赤信号が灯りました。","你的健康亮起了红灯。"],

      {l:["정기 검진 프로그램에 등록한다","Sign up for a regular screening program","定期検診プログラムに登録する","登记参加定期体检项目"],req:G=>G.c[4]>=2||G.s.w>=60,why:["검진 제도나 비용이 필요해요","It takes a screening system or the money for it","検診制度や費用が必要です","需要体检制度或费用"],fx:{h:12,w:-3},res:["꾸준한 검진 덕에 문제를 일찍 잡았습니다.","Steady checkups let you catch problems early.","継続的な検診のおかげで、問題を早く見つけられました。","坚持体检让你及早发现了问题。"]}]},
 {s:5,

function cultureOf(c){
  const iso=c[0]; if(CULT[iso]) return CULT[iso];
  const r=c[3]; // 0 동아시아 1 유럽 2 중남미 3 중동북아프리카 4 북미 5 남아시아 6 사하라이남
  return r===2?"es":r===3?"ar":r===5?"in":r===6?"afw":r===1?"ru":r===0?"id":"en";
}
function makeName(c,sex,rnd){
  const k=cultureOf(c), d=NM[k], pick=a=>a[Math.floor(rnd()*a.length)];
  const given=pick(d[sex]), sur=pick(d.sur);
  return (k==="ko"||k==="ja"||k==="zh")?sur+given:d.sf?sur+" "+given:given+" "+sur;
}

let sceneN=0;
function sceneInner(g,age){
  const Y=160, w=g.s.w, skin=g.skin, ink="#4a4036";
  const fig=(x,h,col,o={})=>`<g transform="translate(${x},${Y})">`+
    `<rect x="${-h*.12}" y="${-h*.24}" width="${h*.08}" height="${h*.24}" rx="2" fill="${ink}"/><rect x="${h*.04}" y="${-h*.24}" width="${h*.08}" height="${h*.24}" rx="2" fill="${ink}"/>`+
    `<rect x="${-h*.15}" y="${-h*.66}" width="${h*.3}" height="${h*.46}" rx="${h*.1}" fill="${col}"/>`+
    `<circle cx="0" cy="${-h*.78}" r="${h*.17}" fill="${o.skin||skin}"/>`+(o.extra||"")+`</g>`;
  const col={m:"#c9594c",f:"#4f7fb3",s:"#e0a53c",c:"#5aa27a",e:"#8a6fb0"};
  const hx=150; let house="";
  if(w<30) house=`<rect x="${hx-30}" y="${Y-30}" width="60" height="30" fill="#b08a5a"/><path d="M${hx-38} ${Y-30}L${hx} ${Y-52}L${hx+38} ${Y-30}Z" fill="#7a5a3a"/><rect x="${hx-6}" y="${Y-18}" width="12" height="18" fill="#5b4330"/>`;
  else if(w<55) house=`<rect x="${hx-38}" y="${Y-40}" width="76" height="40" fill="#e6d3b0"/><path d="M${hx-46} ${Y-40}L${hx} ${Y-68}L${hx+46} ${Y-40}Z" fill="#b0523f"/><rect x="${hx-8}" y="${Y-24}" width="16" height="24" fill="#7a5a3a"/><rect x="${hx+16}" y="${Y-32}" width="14" height="12" fill="#bfe0f0"/>`;
  else if(w<75) house=`<rect x="${hx-44}" y="${Y-46}" width="88" height="46" fill="#efe2c4"/><path d="M${hx-52} ${Y-46}L${hx} ${Y-78}L${hx+52} ${Y-46}Z" fill="#a8483b"/><rect x="${hx+22}" y="${Y-96}" width="9" height="26" fill="#8a5a46"/><rect x="${hx-8}" y="${Y-28}" width="16" height="28" fill="#6a4a38"/><rect x="${hx-34}" y="${Y-36}" width="14" height="14" fill="#bfe0f0"/><rect x="${hx+20}" y="${Y-36}" width="14" height="14" fill="#bfe0f0"/>`;
  else house=`<rect x="${hx-52}" y="${Y-66}" width="104" height="66" fill="#f2e9da"/><rect x="${hx-52}" y="${Y-74}" width="104" height="10" fill="#4d6a8a"/><rect x="${hx-8}" y="${Y-30}" width="16" height="30" fill="#4d6a8a"/>`+[-38,-18,16,36].map(dx=>`<rect x="${hx+dx-6}" y="${Y-54}" width="12" height="14" fill="#bfe0f0"/>`).join("")+`<rect x="${hx-38}" y="${Y-28}" width="14" height="12" fill="#bfe0f0"/><rect x="${hx+26}" y="${Y-28}" width="14" height="12" fill="#bfe0f0"/>`;
  let back="";
  if(g.urban){ [[10,60],[48,92],[86,50],[250,70],[468,84],[506,62],[544,98],[584,58]].forEach(([x,h])=>{back+=`<rect x="${x}" y="${Y-h-4}" width="30" height="${h}" fill="rgba(110,120,140,.38)"/>`+(h>70?`<rect x="${x+8}" y="${Y-h+8}" width="5" height="6" fill="rgba(255,240,200,.5)"/><rect x="${x+17}" y="${Y-h+22}" width="5" height="6" fill="rgba(255,240,200,.5)"/>`:"")}); }
  else { [[40,0],[262,1],[500,0],[570,1]].forEach(([x,k])=>{back+=`<rect x="${x-2}" y="${Y-26}" width="4" height="26" fill="#6b4a33"/><circle cx="${x}" cy="${Y-34}" r="${14+k*4}" fill="#4f8a55"/>`}); back+=`<rect x="226" y="${Y-12}" width="60" height="3" fill="#8a6a45"/><rect x="230" y="${Y-12}" width="3" height="12" fill="#8a6a45"/><rect x="278" y="${Y-12}" width="3" height="12" fill="#8a6a45"/>`; }
  const a=age, pj=g.job?"💼":"";
  const hat=pj?{extra:`<text x="-10" y="-72" font-size="16">${pj}</text>`}:{};
  let people="";
  if(a<3) people=fig(360,62,col.m)+fig(402,68,col.f)+fig(380,20,col.c);
  else if(a<10) people=fig(360,60,col.m)+fig(402,66,col.f)+fig(380,36,col.c,{extra:`<rect x="-15" y="-28" width="10" height="14" rx="3" fill="#d07a3c"/>`});
  else if(a<19) people=fig(370,64,col.f)+fig(415,50,col.c,{extra:`<text x="-8" y="-62" font-size="15">📚</text>`});
  else if(a<30) people=fig(375,64,col.s,hat);
  else if(a<50) people=fig(360,66,col.s,hat)+fig(400,62,col.e)+(g.s.r>=45?fig(430,36,col.c):"");
  else if(a<65) people=fig(360,64,col.s,hat)+fig(400,60,col.e)+fig(440,64,col.c);
  else people=fig(370,56,"#9a8f86",{extra:`<rect x="14" y="-40" width="3" height="40" fill="${ink}"/>`})+(g.s.r>=50?fig(412,30,col.c)+fig(440,58,col.m):"");
  const s=back+house+people;
  return STYLE==="px"?pixelate(s):s;
}
function sceneSVG(g,age,opt={}){
  const id="sg"+(sceneN++), t=opt.t!=null?opt.t:clamp(age/100,0,1);
  const [a,b]=skyColors(t);
  const lift=Math.max(0,Math.round(600/(opt.ar||2.6)-220));
  const [sx,sy]=sunXY(t,lift);
  const hot=clamp((t-.7)/.3,0,1), night=clamp((t-.88)/.12,0,1);
  const main=opt.main?' id="msc"':"";
  const clouds=[[100,48,1],[318,30,.8],[492,58,1.15]].map(([x,y,k])=>`<g opacity="${(.8-night*.6).toFixed(2)}" transform="translate(${x},${y}) scale(${k})"><ellipse cx="0" cy="0" rx="26" ry="9" fill="#fff"/><ellipse cx="-12" cy="-6" rx="13" ry="10" fill="#fff"/><ellipse cx="10" cy="-8" rx="15" ry="12" fill="#fff"/></g>`).join("");
  const stars=[[60,20-lift*.6],[250,40-lift*.8],[450,10-lift*.4],[60,20],[130,45],[220,15],[310,35],[400,18],[470,42],[540,22],[90,70],[350,60],[510,80],[180,90],[580,60]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.5" fill="#fff"/>`).join("");
  const inner=g?sceneInner(g,age):"";
  return `<svg viewBox="0 ${-lift} 600 ${220+lift}" preserveAspectRatio="xMidYMax slice"${main} data-lift="${lift}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}" class="k0"/><stop offset="1" stop-color="${b}" class="k1"/></linearGradient></defs>`+
   `<rect y="${-lift}" width="600" height="${220+lift}" fill="url(#${id})"/><g class="stars" opacity="${night.toFixed(2)}">${stars}</g>`+
   `<circle class="halo" r="30" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" fill="#ffd36b" opacity=".25"/><circle class="sun" r="17" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" fill="rgb(255,${Math.round(211-hot*90)},${Math.round(107-hot*40)})"/>`+
   `<g class="clouds">${clouds}</g>`+
   `<g transform="translate(0,50)"><path d="M0 170V122C70 105 120 112 190 124S320 108 400 118 540 112 600 122V170Z" fill="var(--hill1)"/></g>`+
   `<g transform="translate(0,48)" class="world">${inner}</g>`+
   `<g transform="translate(0,62)"><path d="M0 160V150C90 140 150 146 230 150S380 140 470 147 560 144 600 147V160Z" fill="var(--hill2)"/></g></svg>`;
}
const sunXY=(t,lift)=>{const u=.06+.88*clamp(t,0,1);return [40+520*u,150-(118+lift*.75)*Math.sin(Math.PI*u)]};
let skyT=0, skyRaf=0;
function paintMain(t){
  const sv=document.getElementById("msc"); if(!sv) return;
  const [a,b]=skyColors(t);
  sv.querySelector(".k0").setAttribute("stop-color",a); sv.querySelector(".k1").setAttribute("stop-color",b);
  const [x,y]=sunXY(t,+sv.dataset.lift||0).map(v=>v.toFixed(1));
  for(const n of sv.querySelectorAll(".sun,.halo")){n.setAttribute("cx",x);n.setAttribute("cy",y)}

function mapSVG(mode,hl){

  }

    }

    const p=M.cen[hl]; if(p){const [x,y]=px(p[0],p[1]);

  }
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img"><path class="land" d="${land}"/>${dots}</svg>`;
}

function makeTwin(g){
  const r=mulberry(Math.abs(hashStr(g.name+g.c[0]+g.seed+g.year))+11);
  const up=g.c[4]<=1||g.famTier<=1;
  const L=eraList(g.year).filter(c=>c[0]!==g.c[0]&&c[5]>0), tiers=L.map(c=>c[4]);
  const want=up?Math.max(...tiers):Math.min(...tiers);
  const pool=L.filter(c=>c[4]===want);
  let x=r()*pool.reduce((a,c)=>a+c[5],0), c=pool[0];
  for(const k of pool){x-=k[5];if(x<=0){c=k;break}}
  const t=newLife(Math.floor(r()*1e9)+1,{c,year:g.year,sex:g.sex,fam:up?Math.round(78+r()*15):Math.round(6+r()*14)});
  t.urban=up; t.s0={...t.s}; t.locked=0;
  return t;

let queue=[], cur=null;
function startStage(){
  const st=STAGES[G.stageIdx];
  if(!st||G.lifespan<st.a) return ending();
  if(G.stageIdx===0){
    G.age=Math.min(2,G.lifespan);
    if(G.lifespan<=2) return ending();
    G.stageIdx++; return startStage();
  }
  let pool=EV.filter(e=>e.s===G.stageIdx&&(!e.ok||e.ok(G)));
  const forced=pool.filter(e=>e.jobs===1||e.pri);
  pool=pool.filter(e=>e.jobs!==1&&!e.pri);
  const er=G.daily?mulberry(G.seed+G.stageIdx*101):Math.random;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(er()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const n=Math.min(st.evs,pool.length+forced.length);
  let picked=forced.filter(e=>!e.jobs).concat(pool).slice(0,n-forced.filter(e=>e.jobs).length);
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(er()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]]}
  picked=forced.filter(e=>e.jobs).concat(picked.filter(e=>e.a1&&!e.a0),picked.filter(e=>!e.a0&&!e.a1),picked.filter(e=>e.a0)); // 직업 결정과 어린 나이 사건이 먼저, 나이 제한 사건은 뒤로
  const end=Math.min(st.b,G.lifespan), span=end-st.a+1;
  let prev=st.a-1;
  queue=[];
  picked.forEach((e,i)=>{
    let a=Math.round(st.a+span*(i+0.5)/n+(er()-.5)*span/n*.8);
    a=Math.max(a,prev+1,e.a0||0); if(e.a1) a=Math.max(prev+1,Math.min(a,e.a1)); if(a>end||(e.a1&&a>e.a1)) return;
    prev=a; queue.push({e,age:a});
  });
  nextEvent();
}
function nextEvent(){
  if(!queue.length){
    const st=STAGES[G.stageIdx];
    G.age=Math.min(st.b,G.lifespan);
    if(G.lifespan<=st.b) return ending();
    G.stageIdx++; return startStage();
  }
  cur=queue.shift();
  G.age=Math.min(cur.age,G.lifespan);
  if(G.age>=G.lifespan) return ending();
  cur.ch=cur.e.jobs?jobChoices(G,cur.e):cur.e.ch;
  cur.logged=false;
  passYears(G.shownAge,G.age,()=>{G.shownAge=G.age;showEvent()});
}

/* 사망 원인: 그 나라 사망 원인 비율(WHO, 감염·만성·사고)을 나이에 맞게 기울여 뽑아요 */
function pickCause(age,y,r){
  const iso=G.c[0];
  if(age<5) return "inf";
  if(y<=WAR_LAST&&warLvl(iso,y)>1&&r()<.25) return "war";
  let cm=iv(iso,"comm")||20, nc=iv(iso,"ncd")||70, ij=iv(iso,"inj")||10;

  return x<cm?"sick":x<cm+ij?"inj":age>=75?"illness":"chronic";

/* 가족에게 생기는 일: 부모님은 그분들이 태어난 해의 수명 모델로, 조부모는 어린 시절 언젠가 */
function familyEvents(g){

  const die=(age0,sx)=>{const Mp=lifeModel(iso,g.year-age0,sx);for(let i=0;i<40;i++){const d=sampleAge(Mp,rnd);if(d>age0)return d-age0}return 80-age0};

  const Y=g.year, adj=[1.6,1,.5,.2][g.famTier];

  for(let i=0;i<Math.min(g.sibs,4);i++){const b=1+Math.floor(rnd()*10); if(rnd()<tsv(iso,"q5",Y+b)/1000){out.push({a:b+1+Math.floor(rnd()*3),k:"hp_sib",nc:1,fx:{j:-6,r:-2}});break}}

  if(!g.dr.elec){const u=rnd(); for(let a=2;a<70;a+=2){if((100-(covAt(iso,"elec",Y+a)??100))/100*adj<=u*.9){out.push({a,k:"hp_elec",nc:1,fx:{e:3,j:3},set:"elec"});break}}}
  const nu=rnd(); for(let a=6;a<70;a++){const y=Y+a; if(y<1995) continue; if(netAt(iso,y)/100>=nu*(adj>1?adj*.8:1)){if(y>1996)out.push({a,k:"hp_net",nc:1,fx:{e:3,r:2}});break}}

  return out.filter(e=>e.a>0&&e.a<=110).sort((x,y)=>x.a-y.a);
}

/* 결말 제목: 다섯 줄기를 '보통 인생(모의 플레이 1500판의 중앙값·사분위 폭)'과 비교해 가장 두드러진 쪽으로 정해요 */
const T_MED={h:47,w:43,j:74,r:82,e:50}, T_IQR={h:26,w:32,j:15,r:16,e:30};
function titleIdx(age){
  if(age<5) return 0; if(age<18) return 1;
  const z={}; for(const k of STATKEYS) z[k]=(G.s[k]-T_MED[k])/T_IQR[k];
  const mean=(z.h+z.w+z.j+z.r+z.e)/5;
  const top=["w","r","e","j"].sort((a,b)=>z[b]-z[a])[0];
  if(z[top]>=.7) return {w:2,r:3,e:4,j:5}[top];
  if(mean<=-.55&&z.w<0) return 6; if(mean>=.15) return 7; if(mean>=-.3) return 8; return 9;
}
function ending(){
  const age=Math.min(G.lifespan,110), le=G.c[6];
  if(!G.ended){
    const k=titleIdx(age), diff=age-le;
    const cause=G.cause||(age>=Math.max(70,le)?"full":pickCause(age,G.year+age,Math.random));
    G.ended={age,k,cause,diff};
    const text=UI.titles[k].map((t,i)=>sub(UI.share_text[i],{place:NAMES[G.c[0]][i],age,title:t}));
    G.ended.text=text;
    if(G.daily) store.set("daily",{date:G.date,text:UI.titles[k].map((t,i)=>`${NAMES[G.c[0]][i]} · ${sub(UI.age_n[i],{n:age})} · ${t}`)});
    if(G.hist[G.hist.length-1].a!==age) G.hist.push({a:age,...G.s});
    if(G.twin) syncTwin();
    recordAtlas(); keepLife(); clearRun(); countPlay();
  }
  AUTO=false; clearTimeout(autoT);
  view=renderEnding; renderEnding();
}

function bioLines(info){
  const key=G.bio.slice().sort((a,b)=>b.imp-a.imp).slice(0,G.job?2:3).sort((a,b)=>a.a-b.a);
  const lines=[]; if(G.name) lines.push("· "+G.name);
  lines.push(ui("card_born",{place:place(G.c),tier:UI.tiers[G.famTier][LI]}));
  if(G.job) lines.push(ui("card_job",{job:G.job.n[LI]}));
  for(const k of key) if(!k.job) lines.push(ui("card_choice",{a:k.a,l:tr(k.l,G)}));
  lines.push(ui("card_end",{age:info.age,cause:info.causeTxt}));
  if(G.twin) lines.push(ui(twinAge(G.twin)<1?"card_tw0":"card_tw",{place:place(G.twin.c),name:shortName(G.twin.name),age:twinAge(G.twin),m:G.twin.locked}));
  return lines;
}
function wrapText(ctx,text,w){
  const tokens=LANG==="en"?text.split(/(\s+)/):Array.from(text);
  const out=[];let line="";
  for(const t of tokens){
    if(ctx.measureText(line+t).width>w&&line.trim()){out.push(line.trimEnd());line=t.trim()?t:""}
    else line+=t;
  }
  if(line.trim()) out.push(line.trimEnd());
  return out;
}
function drawCard(info){
  const cv=document.getElementById("card"); if(!cv) return;
  const W=1080,H=1350,ctx=cv.getContext("2d");
  const FF='"Noto Serif KR","Noto Serif JP","Noto Serif SC","Noto Sans KR","Hiragino Mincho ProN","Songti SC","Malgun Gothic",serif';
  ctx.fillStyle="#f7f1e3";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#c4572a";ctx.lineWidth=4;ctx.strokeRect(48,48,W-96,H-96);
  ctx.fillStyle="#c4572a";ctx.font=`500 34px ${FF}`;
  ctx.fillText(G.daily?ui("card_daily",{d:G.date}):UI.title[LI],96,140);
  ctx.fillStyle="#1f1d19";ctx.font=`700 68px ${FF}`;
  let y=250; for(const l of wrapText(ctx,info.title,W-192)){ctx.fillText(l,96,y);y+=88}
  ctx.font=`400 44px ${FF}`;ctx.fillStyle="#3b372f";y+=40;
  for(const ln of bioLines(info)){ for(const l of wrapText(ctx,ln,W-192)){ctx.fillText(l,96,y);y+=68} y+=22 }
  ctx.strokeStyle="#ddd6c6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(96,H-250);ctx.lineTo(W-96,H-250);ctx.stroke();
  ctx.fillStyle="#8c8578";ctx.font=`400 30px ${FF}`;
  ctx.fillText(ui("card_foot",{n:G.locked.length,age:info.age}),96,H-190);
  ctx.fillText(UI.card_sub[LI],96,H-140);
  ctx.fillText(location.protocol.startsWith("http")?location.host+location.pathname.replace(/\/index\.html$/,"/"):SITE.replace(/^https:\/\//,""),96,H-96);
}

/* ---------- 한국어 조사: 이름 끝 받침에 맞추기 ---------- */
function hasBatchim(w){
  const ch=String(w).trim().slice(-1); if(!ch) return false;
  const code=ch.charCodeAt(0);
  if(code>=0xAC00&&code<=0xD7A3) return (code-0xAC00)%28!==0;
  if(/[a-z]/i.test(ch)) return /(n|m|l|ng)$/i.test(String(w).trim()); // 로마자 이름은 한글로 읽었을 때 끝소리 기준(대략)
  return false;
}
// "{name}{는}"처럼 쓴 자리를 이름에 맞는 조사로 바꿔요 (한국어 화면만)
const JOSA={"는":["은","는"],"가":["이","가"],"를":["을","를"],"와":["과","와"],"였":["이었","였"],"야":["이야","야"]};
function kj(s,name){
  return LI===0?s.replace(/\{(는|가|를|와|였|야)\}/g,(m,k)=>JOSA[k][hasBatchim(name)?0:1]):s.replace(/\{(는|가|를|와|였|야)\}/g,"");
}

function twinDay(T,k){
  const set=(TW_DAY[Math.min(6,Math.max(1,G.stageIdx))]||[])[twinUp(T)?1:0]; if(!set) return "";
  const nm=shortName(T.name), line=set[Math.abs(hashStr(T.name+k))%set.length];

  const t=line[LI].replace(/^(같은 해|같은 나이|같은 시기|This year|At the same age|Around the same time|同じ年頃|同じ年|同じ頃|这一年|同样的年纪|差不多同时)[,、，]\s*/,"");

function twinJob(T){
  if(T.ownJob!==undefined) return T.ownJob;
  if(Math.min(T.lifespan,110)<18){T.ownJob=null;return null}
  const r=mulberry(Math.abs(hashStr(T.name+"job"))+3);
  const pool=JOBS.filter(j=>j.w[T.c[4]]>0&&(!j.f||T.famTier>=j.f)&&(!j.e||T.s.e>=j.e||T.famTier>=2&&j.e<=70));
  const wt=j=>j.w[T.c[4]]*(T.famTier>=2?((j.e||0)>=45?4:j.f?3:(j.e||0)>=30?1:.3):T.famTier===0&&(j.e||0)>=45?.2:1);
  T.ownJob=pool.length?wsample(pool,1,wt,r)[0]:null;
  return T.ownJob;
}

const RUN_KEY="run", LIVES_KEY="lives", RUN_VER=()=>EV.length+"-"+STAGES.length+"-"+JOBS.length;
function freezeVal(v,key){
  if(typeof v==="function"){
    const keep=LI, out=[0,1,2,3].map(i=>{LI=i;try{const x=key==="f"?v():v(G);return Array.isArray(x)?x[i]:x}catch(e){return ""}});
    LI=keep; return {__t:out};
  }
  if(Array.isArray(v)) return v.map(x=>freezeVal(x));
  if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=freezeVal(v[k],k);return o}
  return v;
}
function thawVal(v,key){
  if(v&&typeof v==="object"&&!Array.isArray(v)&&v.__t){const t=v.__t;return key==="f"?()=>t[LI]:t}
  if(Array.isArray(v)) return v.map(x=>thawVal(x));
  if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=thawVal(v[k],k);return o}
  return v;
}
const jobIdx=j=>j?JOBS.indexOf(j):-1;
function packLife(g){
  const o=freezeVal({...g,c:g.c[0],pjob:jobIdx(g.pjob),job:jobIdx(g.job),ownJob:undefined,twin:null});
  if(g.twin) o.twin=packLife(g.twin);
  return o;
}
function unpackLife(o){
  const g=thawVal(o);
  g.c=eraC(COUNTRIES.find(x=>x[0]===o.c),g.year||NOW_Y); g.pjob=JOBS[o.pjob]||JOBS[0]; g.job=o.job>=0?JOBS[o.job]:null;

}

/* ---------- 나라 도감과 배지: 끝난 삶마다 이 브라우저에 쌓여요 ---------- */
const ATLAS_KEY="atlas";
const ctryOf=iso=>COUNTRIES.find(c=>c[0]===iso);
function blankAtlas(){return{v:1,n:0,y:0,c:{},a80:0,best:0,jobs:{},ks:{},tiers:[0,0,0,0],days:[],dl0:0,twl:0,rare:0,past:0,fut:0,got:{},tc:{},twn:0,dm:0,dt:0,gap5:0,rev:0}}
function addToAtlas(A,x){
  // x: {c,a,k,j,f,d,dy,dl,tw:{c,a,dl},y}
  A.n++; A.y+=x.a; A.c[x.c]=(A.c[x.c]||0)+1;
  if(x.a>=80) A.a80++; A.best=Math.max(A.best,x.a);
  if(x.j>=0) A.jobs[x.j]=1; A.ks[x.k]=1;
  if(x.f>=0&&x.f<4) A.tiers[x.f]++;
  if(x.dy&&x.d&&!A.days.includes(x.d)) A.days=[...A.days,x.d].slice(-60);
  if(x.dl===0&&x.a>=18) A.dl0++;
  if(x.tw){ A.twn++; A.dm+=x.dl||0; A.dt+=x.tw.dl||0; if(x.tw.c) A.tc[x.tw.c]=(A.tc[x.tw.c]||0)+1; if(x.tw.a>x.a) A.twl++; const g=(x.tw.dl||0)-(x.dl||0); if(g>=5) A.gap5++; if(g<0) A.rev=(A.rev||0)+1; }
  const c=ctryOf(x.c); if(c&&c[5]/totalBirths<0.001) A.rare++;
  if(typeof x.y==="number"&&typeof NOW_Y!=="undefined"){ if(x.y<NOW_Y) A.past++; else if(x.y>NOW_Y) A.fut++; }
}
function loadAtlas(){
  let A=store.get(ATLAS_KEY);
  if(A&&A.v===1){ A.gap5=A.gap5||0; A.rev=A.rev||0; return A; }
  // 도감이 생기기 전에 살았던 삶도 채워 넣어요
  A=blankAtlas();
  const old=(store.get(LIVES_KEY)||[]).slice().reverse();
  for(const x of old) if(ctryOf(x.c)) addToAtlas(A,x);
  for(const b of shownBadges()) if(b.ok(A)) A.got[b.id]=old.length?old[old.length-1].d:todayStr();
  store.set(ATLAS_KEY,A);
  return A;
}
const regionsOf=A=>new Set(Object.keys(A.c).map(i=>(ctryOf(i)||[])[3]).filter(r=>r!=null));
const maxSame=A=>Math.max(0,...Object.values(A.c));
// 배지: [진행, 목표]를 돌려줘요. era는 태어날 시대를 고를 수 있을 때만 보여요
const BADGES=[
 {id:"first",ic:"🌱",p:A=>[A.n,1]},
 {id:"ten",ic:"🔟",p:A=>[A.n,10]},
 {id:"hund",ic:"💯",p:A=>[A.n,100]},
 {id:"c10",ic:"🧭",p:A=>[Object.keys(A.c).length,10]},
 {id:"c50",ic:"🗺️",p:A=>[Object.keys(A.c).length,50]},
 {id:"reg",ic:"🌏",p:A=>[regionsOf(A).size,REGIONS.length]},
 {id:"old10",ic:"👵",p:A=>[A.a80,10]},
 {id:"cent",ic:"🎂",p:A=>[Math.min(A.best,100),100]},
 {id:"ends",ic:"⚖️",p:A=>[(A.tiers[0]?1:0)+(A.tiers[3]?1:0),2]},
 {id:"swap",ic:"🔀",p:A=>[A.twl,1]},
 {id:"gap5",ic:"🗝️",p:A=>[A.gap5,1]},
 {id:"rev",ic:"🔁",p:A=>[A.rev,3]},
 {id:"open",ic:"🚪",p:A=>[A.dl0,1]},
 {id:"jobs",ic:"🧰",p:A=>[Object.keys(A.jobs).length,10]},
 {id:"titles",ic:"📜",p:A=>[Object.keys(A.ks).length,6]},
 {id:"rare",ic:"🔍",p:A=>[A.rare,1]},
 {id:"home",ic:"🏠",p:A=>[maxSame(A),3]},
 {id:"daily",ic:"📅",p:A=>[A.days.length,7]},
 {id:"past",ic:"⏳",era:1,p:A=>[A.past,1]},
 {id:"fut",ic:"🚀",era:1,p:A=>[A.fut,1]}
].map(b=>({...b,ok:A=>{const [v,g]=b.p(A);return v>=g}}));
const shownBadges=()=>BADGES.filter(b=>!b.era||typeof NOW_Y!=="undefined");

// 끝난 삶 하나를 도감에 더하고, 새로 생긴 나라와 배지를 돌려줘요
function recordAtlas(){
  if(!G||!G.ended||G.atlasDone) return G&&G.atlasNew;
  const A=loadAtlas(), T=G.twin, fresh=!A.c[G.c[0]];
  addToAtlas(A,{c:G.c[0],a:G.ended.age,k:G.ended.k,j:jobIdx(G.job),f:G.famTier,d:todayStr(),dy:G.daily?1:0,dl:G.locked.length,tw:T?{c:T.c[0],a:twinAge(T),dl:T.locked}:null,y:G.year});
  const won=[];
  for(const b of shownBadges()) if(!A.got[b.id]&&b.ok(A)){A.got[b.id]=todayStr();won.push(b.id)}
  store.set(ATLAS_KEY,A);
  G.atlasDone=true; G.atlasNew={fresh,won,nc:Object.keys(A.c).length};
  return G.atlasNew;
}

function atlasMap(A,hl){
  const M=MAP,W=M.cols*6,H=M.rows*6;
  const px=(lo,la)=>[(lo+180)/360*W,(M.lat0-la)/(M.lat0-M.lat1)*H];
  let land="";
  for(let r=0;r<M.rows;r++)for(let c=0;c<M.cols;c++){
    if(parseInt(M.hex[r*(M.cols/4)+(c>>2)],16)>>(3-(c&3))&1) land+=`M${c*6+3} ${r*6+3}h0`;
  }
  let off="",on="";
  for(const c of COUNTRIES){
    const p=M.cen[c[0]]; if(!p) continue; const [x,y]=px(p[0],p[1]).map(v=>v.toFixed(1)), n=A.c[c[0]]||0, m=A.tc[c[0]]||0;
    const tip=`<title>${place(c)}${n?" · "+UI.at_lived[LI]+" "+ui("at_times",{n}):""}${m?" · "+UI.at_twin[LI]+" "+ui("at_times",{n:m}):""}</title>`;
    if(!n&&!m){ off+=`<circle class="a0" cx="${x}" cy="${y}" r="2.6">${tip}</circle>`; continue; }
    const r=(4.2+Math.min(Math.max(n,m),6)*1.1).toFixed(1);
    on+=n?`<circle class="a1" cx="${x}" cy="${y}" r="${r}">${tip}</circle>`:"";
    if(m) on+=`<circle class="a2${n?" both":""}" cx="${x}" cy="${y}" r="${(+r+(n?2.4:0)).toFixed(1)}">${n?"":tip}</circle>`;
    if(c[0]===hl) on+=`<circle class="ring" cx="${x}" cy="${y}" r="10"/>`;
  }
  return `<svg class="map atlas-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${UI.at_h[LI]}"><path class="land" d="${land}"/>${off}${on}</svg>`;
}
function regionRows(A){
  const tot=REGIONS.map(()=>0), got=REGIONS.map(()=>0);
  for(const c of COUNTRIES){ if(c[3]==null) continue; tot[c[3]]++; if(A.c[c[0]]) got[c[3]]++; }
  return REGIONS.map((r,i)=>`<div class="r"><span>${r[LI]}</span><i><u style="width:${(got[i]/Math.max(1,tot[i])*100).toFixed(1)}%"></u></i><b>${got[i]}/${tot[i]}</b></div>`).join("");
}
function badgeLI(A,b,isNew){
  const [v,g]=b.p(A), done=!!A.got[b.id];
  return `<li class="bdg${done?" on":""}${isNew?" nw":""}"><span class="em">${done?b.ic:"🔒"}</span><div><b>${UI.bd[b.id][0][LI]}</b><span>${UI.bd[b.id][1][LI]}</span>
    ${done?`<time>${A.got[b.id].slice(5).replace("-","/")}</time>`:`<i class="pb"><u style="width:${(Math.min(v,g)/g*100).toFixed(1)}%"></u></i><small>${Math.min(v,g)} / ${g}</small>`}</div></li>`;
}
function atlasHTML(){
  const A=loadAtlas(); if(!A.n) return "";
  const nc=Object.keys(A.c).length, tn=Object.keys(A.tc).length, share=COUNTRIES.reduce((s,c)=>s+(A.c[c[0]]?c[5]:0),0)/totalBirths*100;
  const next=COUNTRIES.filter(c=>!A.c[c[0]]).sort((a,b)=>b[5]-a[5])[0];
  const bs=shownBadges(), got=bs.filter(b=>A.got[b.id]).length;
  // 받은 배지 먼저, 그다음 거의 다 된 것부터
  const order=bs.slice().sort((a,b)=>{const da=!!A.got[a.id],db=!!A.got[b.id];if(da!==db)return da?-1:1;const [va,ga]=a.p(A),[vb,gb]=b.p(A);return vb/gb-va/ga});
  return `<section class="sec" id="atlas">
    <div class="sec-h"><h2>${UI.at_h[LI]}</h2><p>${ui("at_p",{n:nc,t:COUNTRIES.length,s:share<1?share.toFixed(1):Math.round(share)})}${tn?" "+ui("at_p2",{m:tn}):""}</p></div>
    <div class="where">
      <div class="box">${atlasMap(A)}<div class="at-leg"><span><i class="a1"></i>${UI.at_lived[LI]}</span><span><i class="a2"></i>${UI.at_twin[LI]}</span><span><i class="a0"></i>${UI.at_not[LI]}</span></div>
        ${next?`<p class="cap">${ui("at_next",{place:place(next),p:shareOf(next)})}</p>`:""}</div>
      <div class="box"><div class="box-h"><h3>${UI.at_reg[LI]}</h3><span>${nc} / ${COUNTRIES.length}</span></div><div class="bars at-bars">${regionRows(A)}</div>
        <div class="at-big"><div><b>${Math.round(nc/COUNTRIES.length*100)}%</b><span>${UI.at_pct[LI]}</span></div><div><b>${got}/${bs.length}</b><span>${UI.at_bd[LI]}</span></div>
          ${A.twn?`<div class="tw"><b>${A.dm} : ${A.dt}</b><span>${ui("at_doors",{n:A.twn})}</span></div>`:""}</div></div>
    </div>
    <div class="box bdg-box"><div class="box-h"><h3>${UI.bd_h[LI]}</h3><span>${got} / ${bs.length}</span></div>
      <ul class="bdgs" style="--bc:${bs.length%4?3:4}">${order.map(b=>badgeLI(A,b,false)).join("")}</ul></div>
  </section>`;
}
// 결말 화면 첫머리에 붙는 한 줄: 새 나라, 새 배지
function atlasStrip(){
  const r=recordAtlas(); if(!r) return "";
  const A=loadAtlas(), items=[];
  if(r.fresh) items.push(`<span class="as-c">🗺️ ${ui("at_new",{place:place(G.c),n:r.nc,t:COUNTRIES.length})}</span>`);
  else items.push(`<span class="as-c dim">🗺️ ${ui("at_again",{place:place(G.c),n:A.c[G.c[0]]})}</span>`);
  for(const id of r.won){ const b=BADGES.find(x=>x.id===id); items.push(`<span class="as-b">${b.ic} ${UI.bd[id][0][LI]}</span>`); }
  return `<div class="astrip">${items.join("")}<button class="lnk" id="toAtlas">${UI.at_go[LI]} →</button></div>`;
}
