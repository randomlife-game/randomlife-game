<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f3eee4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤인생게임 · Random Life</title>
<meta name="description" content="80억 명 중 한 명으로 무작위로 태어나 일생을 살아 보는 게임 · Be born as one of 8 billion and live a whole life · 80億人の中の一人として生まれ、一生を生きるゲーム · 成为80亿人中的一个，过完一生">
<meta property="og:type" content="website">
<meta property="og:site_name" content="랜덤인생게임">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="랜덤인생게임 · 80억 명 중 당신은 누가 될까요?">
<meta property="og:description" content="지구에 태어나는 아기 한 명이 되어 일생을 살아 보세요. 같은 날 정반대 형편에서 태어난 아이와 나란히 살아요. 무료 · 가입 없음">
<meta property="og:image" content="https://randomlife-game.github.io/randomlife-game/og.png">
<meta property="og:url" content="https://randomlife-game.github.io/randomlife-game/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://randomlife-game.github.io/randomlife-game/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eee4; --bg2:#e9e1d1; --card:#fffdf8; --ink:#1f1a14; --ink2:#4d4539; --mute:#887e6d;
    --rule:#e2d8c6; --rule2:#cdbfa6; --brand:#c4572a; --brand-soft:#f7e2d3; --cmp:#3f4f86;
    --up:#2c8754; --dn:#c0453f; --land:#d4c9b4; --hill1:#7a8f5a; --hill2:#58714a;
    --gx:16px; --r:18px;
    --ff:"Noto Sans KR","Apple SD Gothic Neo","Noto Sans JP","Hiragino Sans","Noto Sans SC","PingFang SC","Malgun Gothic",system-ui,sans-serif;
    --shadow:0 1px 0 rgba(40,28,12,.04),0 18px 40px -24px rgba(60,40,15,.35);
    --sky:linear-gradient(90deg,#ffc98f 0%,#8ec5ff 20%,#5aa9f0 50%,#f3b36b 75%,#d9776b 90%,#2b2f5a 100%);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15120e; --bg2:#231e17; --card:#1e1a14; --ink:#f1eadc; --ink2:#cbc1ae; --mute:#8f8572;
      --rule:#332b21; --rule2:#4a3e30; --brand:#e8804b; --brand-soft:#3a2416; --cmp:#a8b6f0;
      --up:#6cc58f; --dn:#e9877f; --land:#3d3529; --hill1:#2e3a28; --hill2:#202a1f;
      --shadow:0 18px 40px -24px rgba(0,0,0,.7); }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--brand)}
  @media (min-width:760px){:root{--gx:28px}}
  .only-m{display:contents}.only-d{display:none!important}
  @media (min-width:1000px){.only-m{display:none!important}.only-d{display:flex!important}}

  /* ---------- 위 막대 ---------- */
  .top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
  .top-in{max-width:1320px;margin:0 auto;padding:8px calc(var(--gx) + env(safe-area-inset-right)) 8px calc(var(--gx) + env(safe-area-inset-left));display:flex;align-items:center;gap:10px;min-height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.02em;background:none;border:0;padding:0;white-space:nowrap}
  .mark{width:28px;height:28px;flex:none;display:block}
  .sp{flex:1}
  .seg{display:inline-flex;border:1px solid var(--rule2);border-radius:999px;padding:3px;background:var(--card);gap:2px}
  .seg button{border:0;background:none;color:var(--ink2);font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
  .tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule2);background:var(--card);color:var(--ink2);border-radius:999px;font-size:13px;padding:6px 12px;white-space:nowrap;line-height:1.3}
  .tbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
  .tbtn.ic{padding:6px 10px}
  select.tbtn{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat}
  .ctrls{display:flex;gap:6px;align-items:center}
  /* 진행 중 위 막대 */
  .hud-age{display:flex;align-items:baseline;gap:3px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
  .hud-age b{font-size:34px}.hud-age small{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:0}
  .hud-who{min-width:0;line-height:1.3}
  .hud-who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22em}
  .hud-who span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daybar{position:relative;height:10px;border-radius:99px;background:var(--sky);flex:1;min-width:120px;max-width:380px;margin:0 8px}
  .daybar .cov{position:absolute;top:0;bottom:0;right:0;background:var(--bg2);border-radius:0 99px 99px 0;transition:width .6s ease}
  .daybar .le{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.5;border-radius:2px}
  .daybar .me{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left .6s ease}
  @media (min-width:1000px){.hud2{display:none}}
  .hud2{max-width:1320px;margin:0 auto;padding:0 calc(var(--gx) + env(safe-area-inset-right)) 10px calc(var(--gx) + env(safe-area-inset-left))}
  .hud2 .daybar{max-width:none;margin:2px 0 10px}
  .mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .mini div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;color:var(--ink2);position:relative;line-height:1.25}
  .mini b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- 공통 ---------- */
  .page{max-width:1320px;margin:0 auto;padding:0 calc(var(--gx) + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(var(--gx) + env(safe-area-inset-left))}
  .box{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
  .box-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 12px}
  .box-h h3{font-size:14.5px;font-weight:800;margin:0;letter-spacing:-.01em}
  .box-h span{font-size:12px;color:var(--mute);text-align:right}
  .cap{font-size:12.5px;color:var(--mute);margin:10px 0 0;line-height:1.5}
  .scn{position:relative;overflow:hidden;background:#8ec5ff}
  .scn svg{display:block;width:100%;height:100%}
  .map{display:block;width:100%;height:auto}
  .map .land{fill:none;stroke:var(--land);stroke-width:4.4;stroke-linecap:round}
  .map .bd{fill:var(--brand);opacity:.42;animation:tw 3.2s ease-in-out infinite}
  .map .ring{fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  .map .ring.r2{animation-delay:1s}
  .map .pin{fill:var(--brand);stroke:var(--card);stroke-width:2}
  .dock{position:sticky;bottom:0;z-index:15;margin:0 calc(-1*var(--gx));padding:14px var(--gx) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 32%)}
  .dock .cta{width:100%}
  @media (min-width:1000px){.dock.m{display:none}}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:17px 28px;font-size:18px;font-weight:800;letter-spacing:-.01em;box-shadow:0 14px 28px -14px var(--brand);transition:transform .15s ease,filter .15s}
  .cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .cta2{display:inline-flex;flex-direction:column;align-items:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--rule2);border-radius:14px;padding:11px 18px;font-size:15px;font-weight:700;text-align:left;line-height:1.3}
  .cta2 small{font-size:11.5px;color:var(--mute);font-weight:500}
  .cta2:hover{border-color:var(--ink)}
  .go{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;margin-top:4px}
  .go:hover{filter:brightness(1.15)}
  .ghost{background:none;border:1px solid var(--rule2);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink)}
  .ghost:hover{border-color:var(--ink)}

  /* ---------- 시작 화면 ---------- */
  .hero{display:grid;gap:36px;padding:36px 0 48px;align-items:center}
  @media (min-width:1000px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;padding:56px 0 72px;}}
  .eyebrow{display:flex;flex-wrap:wrap;gap:6px}
  .eyebrow span{font-size:12px;color:var(--ink2);border:1px solid var(--rule2);border-radius:999px;padding:3px 10px;background:var(--card)}
  .h-display{font-size:clamp(40px,6.4vw,86px);line-height:1.06;letter-spacing:-.05em;font-weight:900;margin:22px 0 22px;word-break:keep-all}
  .h-display em{font-style:normal;color:var(--brand)}
  .lead{font-size:clamp(16px,1.5vw,19px);color:var(--ink2);max-width:33em;margin:0 0 28px;word-break:keep-all}
  .cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
  .counters{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 32px;margin:34px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
  .counters b{display:block;font-size:clamp(24px,2.6vw,32px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
  .counters span{font-size:12.5px;color:var(--mute);display:block;max-width:15em;line-height:1.4;margin-top:3px}
  .counters .live b{color:var(--brand);display:flex;align-items:center;gap:8px}
  .counters .live b:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
  @media (max-width:520px){.counters{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.counters b{font-size:22px}.counters span{font-size:11.5px}.cta-row>*{width:100%;align-items:center;text-align:center}}
  .friend{border:1px solid var(--brand);background:var(--brand-soft);border-radius:14px;padding:12px 16px;margin:0 0 20px;font-size:14.5px}
  .baby{background:var(--card);border:1px solid var(--rule);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
  .baby .scn{aspect-ratio:16/9}
  .baby-b{padding:18px 22px 20px}
  .baby-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:4px}
  .baby-top b{color:var(--brand);font-weight:800;letter-spacing:.02em}
  .baby-name{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.25}
  .baby-meta{color:var(--ink2);font-size:14.5px;margin-top:2px}
  .kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .kv3>div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
  .kv3 small{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kv3 b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .baby-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule2);transition:background .3s}.dots i.on{background:var(--brand)}
  .fade{animation:fade .5s ease both}
  .sec{padding:56px 0;border-top:1px solid var(--rule)}
  .sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:26px;flex-wrap:wrap}
  .sec-h h2{font-size:clamp(26px,3.2vw,40px);letter-spacing:-.04em;margin:0;font-weight:900;line-height:1.15;word-break:keep-all}
  .sec-h p{margin:0;color:var(--mute);font-size:14px;max-width:32em}
  .kick{font-size:12.5px;color:var(--brand);font-weight:800;letter-spacing:.04em;margin:0 0 8px;display:flex;gap:8px;align-items:center}
  .where{display:grid;gap:16px}
  @media (min-width:1000px){.where{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
  .bars .r{display:grid;grid-template-columns:minmax(5.5em,9em) 1fr 3.8em;gap:12px;align-items:center;font-size:14px;padding:6px 0}
  .bars .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars i{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
  .bars u{display:block;height:100%;background:var(--brand);border-radius:99px}
  .bars u.rest{background:var(--mute);opacity:.6}
  .bars b{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
  .tiles{display:grid;gap:12px;margin-top:16px}
  @media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
  .tile{border-radius:var(--r);padding:22px 24px;background:var(--ink);color:var(--bg)}
  .tile b{font-size:clamp(38px,4vw,52px);font-weight:900;letter-spacing:-.04em;line-height:1;display:block}
  .tile:nth-child(1) b{color:#ffb98f}.tile:nth-child(2) b{color:#ffd480}.tile:nth-child(3) b{color:#b9c8ff}
  .tile span{font-size:14px;opacity:.82;display:block;margin-top:10px;word-break:keep-all}
  .feats{display:grid;gap:16px}
  @media (min-width:860px){.feats{grid-template-columns:repeat(3,1fr)}}
  .feat h3{font-size:18px;margin:0 0 6px;letter-spacing:-.02em}
  .feat p{margin:0;font-size:14.5px;color:var(--ink2);word-break:keep-all}
  .feat .vis{height:150px;border-radius:12px;margin:0 0 18px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px}
  .mock{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--rule);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
  .mock.lk{border-style:dashed;opacity:.6}
  .mock i{font-style:normal;width:20px;height:20px;border-radius:6px;border:1px solid var(--rule2);display:grid;place-items:center;font-size:11px}
  .vis .daybar{max-width:none;margin:0;height:16px}
  .vis .ages{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .vis .suns{display:flex;justify-content:space-between;font-size:20px}
  .paper{background:#f7f1e3;color:#3b372f;border:2px solid #c4572a;border-radius:4px;padding:12px 14px;font-family:"Noto Serif KR","Noto Serif JP","Noto Serif SC",serif;font-size:12px;line-height:1.6;align-self:center;width:72%;transform:rotate(-2deg);box-shadow:0 8px 16px -10px rgba(0,0,0,.4)}
  .paper b{display:block;font-size:15px;color:#1f1d19;margin-bottom:4px}
  .info3{display:grid;gap:28px}
  @media (min-width:860px){.info3{grid-template-columns:repeat(3,1fr);gap:40px}}
  .info3 h3{font-size:16px;margin:0 0 10px}
  .info3 p{font-size:14px;color:var(--ink2);margin:0 0 8px;word-break:keep-all}
  .faq details{border-top:1px solid var(--rule);padding:10px 0}.faq details:first-of-type{border-top:0;padding-top:0}
  .faq summary{cursor:pointer;font-weight:700;font-size:14.5px}.faq p{margin:6px 0 2px}
  .foot{border-top:1px solid var(--rule);padding:22px 0 0;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:12.5px;color:var(--mute)}
  .foot p{margin:0;max-width:52em}

  /* ---------- 진행 화면 (3단) ---------- */
  .dash{display:grid;gap:16px;padding:18px 0 8px;grid-template-areas:"b" "a" "c";grid-template-columns:minmax(0,1fr)}
  @media (min-width:760px){.dash{grid-template-columns:minmax(250px,300px) minmax(0,1fr);grid-template-areas:"a b" "c b";align-items:start}}
  @media (min-width:1180px){.dash{grid-template-columns:290px minmax(0,1fr) 310px;grid-template-areas:"a b c";gap:20px;padding-top:22px}}
  .col{display:grid;gap:16px;min-width:0;align-content:start}
  @media (min-width:1180px){.col{gap:20px}}
  .ca{grid-area:a}.cb{grid-area:b}.cc{grid-area:c}
  .scene-card{border-radius:22px;overflow:hidden;border:1px solid var(--rule);position:relative;box-shadow:var(--shadow)}
  .scene-card .scn{aspect-ratio:16/8}
  @media (min-width:1180px){.scene-card .scn{aspect-ratio:16/7}}
  .scene-tag{position:absolute;left:12px;top:12px;font-size:12.5px;color:#fff;background:rgba(20,15,10,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:4px 11px;border-radius:99px;font-weight:600}
  .scene-tag:empty{display:none}
  .evc{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:22px 24px 24px;position:relative}
  @media (max-width:520px){.evc{padding:18px 16px 18px}}
  .evc .q{font-size:clamp(18px,1.9vw,22px);font-weight:800;letter-spacing:-.03em;line-height:1.45;margin:0 0 18px;word-break:keep-all}
  .choices{display:grid;gap:10px}
  .ch{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:15.5px;font-weight:650;line-height:1.4;transition:border-color .15s,background .15s,transform .15s}
  .ch .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--card);border:1px solid var(--rule2);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink2)}
  .ch:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
  .ch:hover:not(:disabled) .n{background:var(--brand);color:#fff;border-color:var(--brand)}
  .ch.locked{opacity:.62;border-style:dashed;cursor:not-allowed;background:transparent}
  .ch .why{display:block;font-size:12.5px;font-weight:500;color:var(--mute);margin-top:2px}
  .result{font-size:17px;line-height:1.65;margin:0 0 14px;padding-left:14px;border-left:3px solid var(--brand);word-break:keep-all}
  .deltas{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .dl{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--bg2);color:var(--ink2)}
  .dl.up{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
  .dl.dn{background:color-mix(in srgb,var(--dn) 15%,transparent);color:var(--dn)}
  .pass{cursor:pointer;text-align:center;padding:10px 0 4px}
  .pass .pa{font-size:clamp(56px,7vw,84px);font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 16px}
  .pass .pa small{font-size:20px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:4px}
  .pbar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--sky);background-size:100vw 100%;border-radius:99px}
  .fact{margin-top:16px;text-align:left;background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;animation:rise .4s ease both;word-break:keep-all}
  .fact span{display:block;font-size:11.5px;color:var(--brand);font-weight:800;margin-bottom:3px}
  .roll{text-align:center;padding:18px 0}
  .roll .big{font-size:clamp(30px,4vw,44px);font-weight:900;letter-spacing:-.03em;min-height:1.4em}
  .born-h{font-size:clamp(24px,2.6vw,30px);font-weight:900;letter-spacing:-.04em;margin:0 0 6px}
  .born-p{color:var(--ink2);margin:0 0 18px;font-size:15px;word-break:keep-all}
  .nm{width:100%;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:10px 14px;border:1.5px solid var(--rule2);border-radius:12px;background:var(--bg);color:var(--ink)}
  .nm:focus{outline:none;border-color:var(--brand)}
  .flab{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:600}
  .fnote{font-size:12.5px;color:var(--mute);margin:6px 0 18px}
  /* 출생 신고서 */
  .reg{position:relative;overflow:hidden}
  .reg .rh{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:2px}
  .reg .rh b{font-size:14px;letter-spacing:.12em}
  .reg .rh span{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .reg .who{padding-right:84px!important;font-size:21px;font-weight:900;letter-spacing:-.03em;padding:12px 0 8px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
  .reg dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
  .reg dt,.reg dd{padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px;margin:0}
  .reg dt{color:var(--mute);padding-right:14px;white-space:nowrap}
  .reg dd{font-weight:650;text-align:right}
  .reg dl>*:nth-last-child(-n+2){border-bottom:0}
  .stamp{position:absolute;right:12px;top:40px;width:78px;height:78px;border:3px double var(--brand);border-radius:50%;color:var(--brand);display:grid;place-items:center;transform:rotate(-14deg);font-weight:900;font-size:12px;line-height:1.15;text-align:center;opacity:.75;pointer-events:none;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
  .stamp small{display:block;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums}
  /* 상태 */
  .stl{display:grid;gap:10px}
  .stl .r{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;align-items:center;position:relative}
  .stl .ic{font-size:18px;line-height:1;grid-row:span 2}
  .stl .nm2{font-size:13.5px;font-weight:700}
  .stl .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right;display:flex;gap:6px;align-items:center}
  .stl .bar{grid-column:2/4;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden}
  .stl .bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .chip{font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;color:#fff;animation:rise .5s ease both}
  .chip.up{background:var(--up)}.chip.dn{background:var(--dn)}
  .lk-list{list-style:none;margin:0;padding:0;font-size:13.5px}
  .lk-list li{padding:7px 0;border-top:1px dashed var(--rule2);display:grid;grid-template-columns:auto 1fr;gap:8px}
  .lk-list li:first-child{border-top:0}
  .lk-list .a{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
  .lk-list .w{display:block;font-size:12px;color:var(--mute)}
  .bignum{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:0 0 6px}
  /* 다른 출발의 아이 */
  .twin{margin-top:18px;border:1.5px dashed var(--rule2);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--cmp) 5%,transparent)}
  .tw-h{display:flex;gap:10px;align-items:flex-start}
  .tw-h b{display:block;font-size:14px;letter-spacing:-.01em}
  .tw-h span{display:block;font-size:12.5px;color:var(--mute);line-height:1.45}
  .tw-badge{flex:none;width:30px;height:30px;border-radius:10px;background:var(--cmp);display:grid!important;place-items:center;font-size:15px}
  .tw-l{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
  .tw-l li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600;padding:7px 10px;border-radius:10px;background:var(--card);border:1px solid var(--rule)}
  .tw-l li i{font-style:normal;flex:none;width:18px;text-align:center;color:var(--up)}
  .tw-l li.lk{opacity:.7}.tw-l li.lk i{color:var(--mute)}
  .tw-l small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
  .tw-l em{display:table;font-style:normal;font-size:11.5px;font-weight:800;margin-top:4px;padding:2px 8px;border-radius:7px;line-height:1.4}
  .tw-l li.open{opacity:1;border-color:var(--cmp)}.tw-l li.open em{background:var(--cmp);color:var(--card)}
  .tw-l li.shut em{background:var(--dn);color:#fff}
  .tw-none{margin:10px 0 0;font-size:13px;color:var(--ink2)}
  .tw-who b{display:block;font-size:17px;font-weight:900;letter-spacing:-.02em}.tw-who span{font-size:12.5px;color:var(--mute)}
  .tw-day{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--rule);font-size:14px;font-weight:600;line-height:1.5}
  .twin.gone{border-style:solid;border-color:var(--ink2);background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .twin.gone .tw-badge{background:var(--ink)}
  .tw-rip{font-size:12px;font-weight:700;color:var(--mute);margin-left:4px}
  .resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px 12px 16px;margin:0 0 20px;background:var(--card)}
  .resume b{display:block;font-size:15px}.resume span{display:block;font-size:13px;color:var(--mute)}
  .cta.sm{padding:11px 18px;font-size:15px;border-radius:12px;box-shadow:none}
  .ghost.sm{padding:7px 12px;font-size:13px}
  .lives{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
  .lives li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--bg)}
  .lv-a{flex:none;min-width:52px;font-weight:900}.lv-a b{font-size:24px}.lv-a small{font-size:12px;margin-left:1px}
  .lv-b{flex:1;min-width:0}.lv-b b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-b span,.lv-b small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.45}.lv-b small{color:var(--mute);margin-top:3px}
  .lives time{flex:none;font-size:12px;color:var(--mute)}
  .lv-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.lv-f .cap{margin:0}
  .cta.chat{width:100%;flex-direction:column;gap:2px;margin:0 0 14px;padding:14px 18px;font-size:17px}
  .cta.chat small{font-size:12px;font-weight:600;opacity:.9}
  .cmp table{width:100%;border-collapse:collapse;font-size:14px}
  .cmp th,.cmp td{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
  .cmp th{font-size:12.5px;color:var(--mute);font-weight:600;width:28%}
  .cmp thead th{color:var(--ink);font-size:14px;font-weight:800}
  .cmp td.t{color:var(--cmp);font-weight:700}
  .cmp-l{margin:14px 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .vs{display:grid;gap:8px;margin-top:12px}
  .vs>div{display:grid;grid-template-columns:minmax(0,1fr) 70px 22px;gap:8px;align-items:center;font-size:12.5px}
  .vs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
  .vs i{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}.vs u{display:block;height:100%;background:var(--brand);border-radius:99px}.vs u.t{background:var(--cmp)}
  .vs b{text-align:right;font-variant-numeric:tabular-nums}
  .mock.tw{border-color:var(--cmp);color:var(--cmp)}
  /* 기록 */
  .log{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;overscroll-behavior:contain}
  .log li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5}
  .log li:first-child{border-top:0}
  .log li .a{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
  .log li.fresh{animation:rise .4s ease both}
  .log.full{max-height:none}
  /* 나라 */
  .ind{margin:0 0 11px}.ind:last-of-type{margin-bottom:0}

  .ibar u{position:absolute;top:-3px;width:2px;height:13px;background:var(--cmp);text-decoration:none;border-radius:2px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  .legend u{display:inline-block;width:2px;height:10px;background:var(--cmp);margin-right:5px;vertical-align:-1px}
  .curve{width:100%;height:auto;display:block}
  .cl{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s ease forwards}
  .skel{min-height:140px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s linear infinite}
  .mset{display:flex;gap:8px;justify-content:center;padding:6px 0 0}
  /* ---------- 결말 ---------- */
  .endhero{display:grid;gap:24px;padding:28px 0 8px;align-items:center}
  @media (min-width:1000px){.endhero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding:40px 0 12px}}
  .endhero h1{font-size:clamp(34px,5vw,64px);font-weight:900;letter-spacing:-.05em;line-height:1.08;margin:6px 0 14px;word-break:keep-all}
  .endhero p.sum{font-size:clamp(15px,1.4vw,18px);color:var(--ink2);margin:0 0 20px;word-break:keep-all}
  .facts4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
  @media (min-width:760px){.facts4{grid-template-columns:repeat(4,1fr)}}
  .facts4>div{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-width:0}
  .facts4 small{display:block;font-size:11.5px;color:var(--mute)}.facts4 b{font-size:17px;letter-spacing:-.02em;overflow-wrap:anywhere}
  .endhero .scene-card .scn{aspect-ratio:16/10}
  canvas#card{width:100%;height:auto;border-radius:10px;border:1px solid var(--rule);display:block}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.row2 .ghost{font-size:13px;padding:10px 8px}
  .sns{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-top:8px}
  .sns a{text-align:center;text-decoration:none;color:var(--ink);font-size:13.5px;padding:9px 6px}

  /* ---------- 도트 그림체 ---------- */
  body.px .box,body.px .evc,body.px .scene-card,body.px .baby,body.px .tile,body.px .ch,body.px .cta,body.px .cta2,body.px .go,body.px .ghost,body.px .facts4>div,body.px .kv3>div,body.px .nm,body.px .mini div,body.px .feat .vis{border-radius:0}
  body.px .box,body.px .evc,body.px .scene-card,body.px .baby{border-width:2px;box-shadow:4px 4px 0 var(--rule2)}
  body.px .ch{border-width:2px;box-shadow:3px 3px 0 var(--rule)}
  body.px .stl .bar,body.px .stl .bar i,body.px .ibar,body.px .ibar i,body.px .bars i,body.px .bars u,body.px .daybar,body.px .pbar,body.px .pbar i{border-radius:0}
  body.px .scn svg{image-rendering:pixelated}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.8)}to{opacity:.75;transform:rotate(-14deg) scale(1)}}
  @keyframes tw{50%{opacity:.14}}
  @keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
  @keyframes sh{to{background-position:-200% 0}}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .rise{animation:rise .35s ease both}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.cl{stroke-dashoffset:0}}
</style>

function wsample(arr,n,wf,rf){
  const pool=arr.slice(),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((s,x)=>s+wf(x),0);let x=rf()*tot,i=0;
    for(;i<pool.length;i++){x-=wf(pool[i]);if(x<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}

  return wsample(pool,1,j=>jobW(j,G)*(G.famTier>=2&&(j.e||0)>=45?2:1),rnd)[0];
}
function jobChoices(G,e){
  const rf=G.daily?mulberry(G.seed+e.jobs*977+G.stageIdx):Math.random;

  const offers=wsample(elig,e.jobs===1?3:2,j=>jobW(j,G),rf);
  const locked=JOBS.filter(j=>!jobOk(j,G)&&j.w[Math.min(3,G.c[4]+1)]>0);
  const ch=offers.map(j=>({l:j.n,fx:j.fx,job:j,res:ui("job_res",{job:j.n[LI]})}));
  if(locked.length){
    const j=locked[Math.floor(rf()*locked.length)];
    const why=(j.f&&G.famTier<j.f)?"lock_f":(j.h&&G.s.h<j.h)?"lock_h":"lock_e";
    ch.push({l:j.n,req:()=>false,why:UI[why]});
  }
  if(e.jobs===2) ch.push({l:UI.job_keep,fx:{w:2},res:UI.job_keep});
  return ch;
}

  ch:[{l:["조용히 방에서 책을 읽는다","Read quietly in your room","部屋で静かに本を読む","在房间里安静地读书"],fx:{e:6,j:-2},res:["책이 가장 가까운 친구가 됐습니다.","Books became your closest friends.","本がいちばん身近な友だちになりました。","书成了你最亲近的朋友。"]},
      {l:["밖에서 동네 친구들과 논다","Go out and play with the neighborhood kids","外で近所の友だちと遊ぶ","出去和邻居小孩玩"],fx:{r:8,h:3},res:["동네에서 대장 노릇을 했습니다.","You became the leader of the neighborhood.","近所のガキ大将になりました。","你成了街坊小孩里的头儿。"]}]},
 {s:1,ok:G=>G.famTier<=1,
  t:["심하게 열이 오릅니다.","You run a dangerously high fever.","ひどい熱が出ます。","你烧得很厉害。"],
  ch:[{l:["병원에 간다","Go to the hospital","病院に行く","去医院"],req:G=>!(poor(G)&&G.c[4]===0),why:["가까운 병원도, 낼 돈도 없어요","There is no nearby hospital, and no money","近くに病院もなく、お金もありません","附近没有医院，也没有钱"],fx:{h:4,w:-6},
       res:G=>pk(G,["먼 거리를 업혀서 갔고, 돈이 많이 들었지만 나았습니다.","You were carried a long way, and it cost a lot, but you recovered.","遠い道のりを背負われて行き、お金はかかりましたが回復しました。","被人背着走了很远，花了不少钱，但你好转了。"],["치료를 받고 곧 나았습니다.","You were treated and soon recovered.","治療を受けて、すぐに回復しました。","你接受了治疗，很快痊愈。"]),
       risk:{p:G=>poor(G)&&lowInc(G)?0.08:0.01,die:"inf"}},
      {l:["집에서 버틴다","Tough it out at home","家で耐える","在家硬扛"],fx:{h:-5},res:["며칠 앓고 겨우 일어났습니다.","After a few days of suffering, you finally got up.","数日寝込んで、やっと起き上がれました。","病了几天，总算爬了起来。"],risk:{p:G=>poor(G)&&lowInc(G)?0.25:0.05,die:"inf"}},
      {l:["이웃에게 도움을 구한다","Ask a neighbor for help","近所の人に助けを求める","向邻居求助"],fx:{r:6,h:1},res:["이웃이 약과 죽을 나눠 주었습니다.","A neighbor shared medicine and porridge.","近所の人が薬とお粥を分けてくれました。","邻居分给你药和粥。"],risk:{p:G=>0.15,die:"inf"}}]},
 {s:1,ok:G=>G.famTier>=1,
  t:["전학을 가게 됐습니다. 낯선 교실의 첫날.","You are transferring schools. The first day in an unfamiliar classroom.","転校することになりました。見知らぬ教室での初日。","你要转学了，在陌生教室的第一天。"],
  ch:[{l:["먼저 말을 건다","Speak up first","自分から話しかける","主动搭话"],fx:{r:9,j:2},res:["금방 친구가 생겼습니다.","You quickly made friends.","すぐに友だちができました。","你很快交到了朋友。"]},
      {l:["눈치를 보며 지낸다","Keep a low profile","様子をうかがって過ごす","察言观色地待着"],fx:{r:-2,e:3},res:["조용히 적응했습니다.","You adjusted quietly.","静かに馴染んでいきました。","你悄悄地适应了。"]}]},
 {s:1,ok:G=>rich(G),
  t:["생일에 가족이 작은 파티를 열어 줍니다.","Your family throws you a small birthday party.","誕生日に家族が小さなパーティーを開いてくれます。","生日那天，家人为你办了个小派对。"],
  ch:[{l:["기쁘게 즐긴다","Enjoy it with joy","楽しむ","开心地享受"],fx:{j:7,r:4},res:["오래 기억에 남을 하루였습니다.","It was a day you would remember for a long time.","いつまでも心に残る一日でした。","那是难忘的一天。"]},
      {l:["장난감보다 책을 부탁한다","Ask for books instead of toys","おもちゃより本をお願いする","要书不要玩具"],fx:{e:6,j:2},res:["책 몇 권이 세계를 넓혀 줬습니다.","A few books widened your world.","数冊の本が世界を広げてくれました。","几本书拓宽了你的世界。"]}]},
 {s:1,ok:G=>lowInc(G),
  t:["마을에는 수도가 없어 매일 물을 길어 와야 합니다.","There is no tap in the village, so water has to be fetched every day.","村には水道がなく、毎日水を汲みに行かなければなりません。","村里没有自来水，每天都得去打水。"],
  ch:[{l:["아침마다 물동이를 나른다","Carry water every morning","毎朝水がめを運ぶ","每天早上挑水"],fx:{h:-2,r:5,e:-3},res:["하루의 첫 일과가 물 나르기였습니다.","Fetching water was the first task of every day.","一日の最初の仕事は水汲みでした。","打水成了每天的第一件事。"]},
      {l:["마을 어른들의 우물 모임에 따라간다","Tag along to the elders' gathering at the well","村の大人たちの井戸端の集まりについて行く","跟着村里大人去井边聚会"],fx:{r:7,e:2},res:["어른들의 이야기를 곁에서 들었습니다.","You listened to the grown-ups' stories.","大人たちの話をそばで聞きました。","你在一旁听大人们讲故事。"]}]},
 {s:1,ok:G=>!lowInc(G),
  t:["방과 후에 무엇을 할지 고릅니다.","You choose what to do after school.","放課後に何をするか選びます。","你选择放学后做什么。"],
  ch:[{l:["학원에 다닌다","Go to cram school","塾に通う","去上补习班"],req:G=>G.s.w>=40,why:["학원비가 필요해요","It costs tuition money","塾の月謝が必要です","需要补习费"],fx:{e:10,j:-3,w:-4},res:["공부 습관이 일찍 잡혔습니다.","You built study habits early.","勉強の習慣が早くから身につきました。","你早早养成了学习习惯。"]},
      {l:["도서관에서 책을 빌려 읽는다","Borrow and read books at the library","図書館で本を借りて読む","在图书馆借书读"],fx:{e:6,j:3},res:["도서관이 놀이터가 됐습니다.","The library became your playground.","図書館が遊び場になりました。","图书馆成了你的游乐场。"]},
      {l:["친구들과 뛰어논다","Run around with friends","友だちと駆け回る","和朋友疯玩"],fx:{r:8,h:3,e:-1},res:["해가 질 때까지 놀았습니다.","You played until sunset.","日が暮れるまで遊びました。","你玩到太阳落山。"]}]},
 {s:1,
  t:["동생이 태어났습니다.","A younger sibling is born.","弟か妹が生まれました。","弟弟或妹妹出生了。"],
  ch:[{l:["동생을 열심히 돌본다","Look after the baby eagerly","弟妹を一生懸命世話する","认真照顾弟妹"],fx:{r:8,j:3,e:-2},res:["든든한 형 누나가 됐습니다.","You became a dependable older sibling.","頼もしい兄や姉になりました。","你成了可靠的哥哥姐姐。"]},
      {l:["내 몫을 지키려 투정을 부린다","Throw tantrums to protect your share","自分の分を守ろうとわがままを言う","为了守住自己那份而耍脾气"],fx:{r:-3,j:2},res:["한동안 집안이 시끄러웠습니다.","The house was noisy for a while.","しばらく家の中が騒がしくなりました。","家里吵闹了一阵子。"]}]},
 /* 청소년기 */
 {s:2,
  t:G=>pk(G,["학교에서 진로 이야기가 나옵니다. 주변에는 일찍 일터로 가는 아이도 많습니다.","Talk of the future comes up at school. Many kids around you head to work early.","学校で進路の話が出ます。周りには早くから働きに出る子も多くいます。","学校里开始谈论前途。你身边不少孩子很早就去干活了。"],["학교에서 진로 이야기가 나옵니다. 성적과 학원 이야기가 한창입니다.","Talk of the future comes up at school. Grades and cram schools are all anyone discusses.","学校で進路の話が出ます。成績や塾の話題でもちきりです。","学校里开始谈论前途，成绩和补习班是热门话题。"]),
  ch:[{l:["공부에 매달린다","Throw yourself into studying","勉強に打ち込む","埋头苦读"],fx:{e:14,h:-4,j:-3},res:["성적은 올랐지만 몸과 마음이 지쳤습니다.","Your grades rose, but body and mind wore out.","成績は上がりましたが、心身が疲れ果てました。","成绩上去了，身心却疲惫不堪。"]},
      {l:["기술을 배우며 일을 시작한다","Start working while learning a trade","技術を学びながら働き始める","边学手艺边开始工作"],fx:{w:8,e:4,r:3},res:["일찍 손에 익은 기술이 생겼습니다.","You picked up a skill early on.","早くから身についた技術ができました。","你早早练就了一门手艺。"]},
      {l:["균형 있게 지낸다","Keep a balance","バランスよく過ごす","保持平衡"],fx:{e:6,j:5,r:4},res:["무난한 청소년기를 보냈습니다.","You had an uneventful adolescence.","無難な思春期を過ごしました。","你度过了平稳的青少年时期。"]},
      {l:["해외 대학에 지원한다","Apply to a university abroad","海外の大学に出願する","申请海外大学"],req:G=>G.famTier>=2||G.s.e>=75,why:["학비와 입학 정보가 있어야 열려요","It takes tuition money and admission know-how","学費と入学情報が必要です","需要学费和入学信息"],fx:{e:16,w:-6,r:-4},res:["낯선 나라의 캠퍼스를 꿈꾸게 됐습니다.","You started dreaming of a campus in a faraway country.","見知らぬ国のキャンパスを夢見るようになりました。","你开始向往异国的校园。"]}]},
 {s:2,ok:G=>G.famTier<=2&&luck(G,31)<0.6,
  t:["집안 사정이 갑자기 어려워졌습니다.","Your family's circumstances suddenly turn hard.","家の事情が急に厳しくなりました。","家里的境况忽然变得艰难。"],
  ch:[{l:["학업을 잠시 접고 일한다","Set school aside and go to work","学業をいったん諦めて働く","暂时放下学业去打工"],fx:{w:10,e:-8,j:-4},res:["가족을 위해 일터로 나갔습니다.","You went to work for your family.","家族のために働きに出ました。","你为了家人走进了工地和店铺。"]},
      {l:["장학금과 친척 도움을 알아본다","Look into scholarships and help from relatives","奨学金や親戚の助けを探す","打听奖学金和亲戚的帮助"],fx:{e:5,w:-2,r:3},res:["어렵게 학교를 이어 갔습니다.","You managed to stay in school, barely.","苦労しながら学校を続けました。","你艰难地把书念了下去。"],risk:{p:G=>0.35,fx:{e:-8,j:-4},res:["도움은 닿지 않았고 결국 학업을 중단했습니다.","Help never came, and you left school in the end.","助けは届かず、結局学業を中断しました。","帮助没能到来，你最终还是辍学了。"]}}]},
 {s:2,
  t:["처음으로 마음이 가는 사람이 생겼습니다.","For the first time, someone catches your heart.","初めて、気になる人ができました。","你第一次有了心动的人。"],
  ch:[{l:["용기 내어 고백한다","Gather your courage and confess","勇気を出して告白する","鼓起勇气表白"],fx:{r:7,j:6},res:["결과가 어떻든 잊지 못할 경험이 됐습니다.","Whatever the result, it became an unforgettable experience.","結果がどうあれ、忘れられない経験になりました。","不论结果如何，这都成了难忘的经历。"],risk:{p:G=>0.4,fx:{j:-8,r:-3},res:["거절당해 한동안 마음이 쓰렸습니다.","You were turned down and hurt for a while.","断られて、しばらく胸が痛みました。","你被拒绝了，难过了好一阵子。"]}},
      {l:["혼자 마음에 담아 둔다","Keep it to yourself","一人で胸にしまっておく","把心意藏在心里"],fx:{j:-1,e:3},res:["일기장에만 이름을 적었습니다.","You wrote the name only in your diary.","名前は日記にだけ書きました。","你只在日记里写下了那个名字。"]}]},
 {s:2,
  t:["또래들이 위험한 일탈을 함께 하자고 합니다.","Your peers invite you to join in something risky.","同世代の子たちが危ない悪ふざけに誘います。","同龄人邀你一起做危险的出格事。"],
  ch:[{l:["함께 어울린다","Join them","一緒に加わる","一起去"],fx:{r:6,j:5,h:-5},res:["짜릿했지만 후폭풍이 따랐습니다.","It was thrilling, but there were consequences.","スリルはありましたが、後で痛い目を見ました。","很刺激，但随后付出了代价。"],risk:{p:G=>0.25,fx:{h:-10,e:-8},res:["사고가 나 크게 다쳤습니다.","There was an accident and you were badly hurt.","事故が起きて大けがをしました。","出了事故，你受了重伤。"]}},
      {l:["거절한다","Refuse","断る","拒绝"],fx:{r:-4,e:4},res:["친구 몇 명을 잃었지만 자신을 지켰습니다.","You lost a few friends but protected yourself.","友だちを何人か失いましたが、自分を守りました。","你失去了几个朋友，却守住了自己。"]}]},
 {s:2,
  t:G=>{const n=nmA(G);return pk(G,[`${n[0]}에서는 학교가 멀고 시설이 부족해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, schools are far and poorly equipped, so choices are hard. You consider going on to higher school.`,`${n[2]}では学校が遠く設備も足りず、選択は簡単ではありません。進学を考えます。`,`在${n[3]}，学校远、设施少，选择并不容易。你考虑继续升学。`],[`${n[0]}에서는 입시 경쟁이 치열해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, entrance competition is fierce, so choices are hard. You prepare to go on to higher school.`,`${n[2]}では受験競争が激しく、選択は簡単ではありません。進学を準備します。`,`在${n[3]}，升学竞争激烈，选择并不容易。你准备继续升学。`])},
  ch:[{l:["끝까지 도전한다","Go for it to the end","最後まで挑戦する","拼到最后"],fx:{e:12,j:-3,w:-4},res:["고생 끝에 진학의 문턱에 닿았습니다.","After much hardship, you reached the threshold of further study.","苦労の末、進学の入り口にたどり着きました。","历经辛苦，你摸到了升学的门槛。"],risk:{p:G=>poor(G)?0.45:0.2,fx:{e:-2,j:-6},res:["원하는 곳에 가지 못해 낙담했습니다.","You didn't get into the place you wanted and felt crushed.","希望の進学先に行けず、落ち込みました。","没能进入想去的学校，你很沮丧。"]}},
      {l:["현실적인 길을 택한다","Take the realistic path","現実的な道を選ぶ","选择现实的路"],fx:{w:6,e:3},res:["안정적인 직업 훈련 쪽으로 방향을 잡았습니다.","You steered toward stable vocational training.","安定した職業訓練の方へ舵を切りました。","你转向了稳妥的职业培训。"]}]},
 {s:2,
  t:["세상과 연결된 화면 하나가 생겼습니다.","A screen that connects you to the world comes into your life.","世界とつながる画面が一つ手に入りました。","你有了一块连接世界的屏幕。"],
  ch:[{l:["온라인 강의를 듣는다","Take online lessons","オンライン講義を受ける","听网课"],req:G=>G.c[4]>=2||G.s.w>=45,why:["기기와 안정적인 인터넷이 필요해요","It takes a device and a stable connection","端末と安定したネット回線が必要です","需要设备和稳定的网络"],fx:{e:10,j:2},res:["집에서도 먼 세계의 수업을 들었습니다.","From home, you sat in classes from distant places.","家にいながら遠い世界の授業を受けました。","你在家就听到了远方世界的课。"]},
      {l:["친구 휴대폰으로 잠깐씩 본다","Borrow a friend's phone for short looks","友だちの携帯を借りて少しだけ見る","借朋友的手机偶尔看看"],fx:{e:3,r:4},res:["짧은 시간이었지만 많은 걸 알게 됐습니다.","The time was short, but you learned a lot.","短い時間でしたが、多くのことを知りました。","时间虽短，你却学到了很多。"]},
      {l:["책과 필기만으로 공부한다","Study with only books and notes","本とノートだけで勉強する","只靠书和笔记学习"],fx:{e:5,h:1},res:["느리지만 꾸준히 쌓았습니다.","It was slow, but you built it up steadily.","遅くても着実に積み上げました。","虽然慢，却一点点稳稳积累。"]}]},
 {s:2,ok:G=>G.s.e>=40,
  t:["학교에서 큰 대회와 교류 프로그램 소식이 들려옵니다.","News of a big competition and an exchange program reaches your school.","学校に大きな大会と交流プログラムの知らせが届きます。","学校传来了大型比赛和交流项目的消息。"],
  ch:[{l:["교환학생으로 떠난다","Leave as an exchange student","交換留学生として旅立つ","去做交换生"],req:G=>G.s.w>=60,why:["체류 비용을 댈 수 있어야 해요","It takes money to live abroad","滞在費を出せることが必要です","需要付得起在外生活的费用"],fx:{e:12,r:-4,j:6},res:["다른 나라의 교실에서 한 해를 보냈습니다.","You spent a year in a classroom in another country.","他の国の教室で一年を過ごしました。","你在另一个国家的教室里度过了一年。"]},
      {l:["국내 대회에 도전한다","Enter a domestic competition","国内の大会に挑戦する","参加国内比赛"],fx:{e:8,j:4},res:["입상은 못 했지만 자신감을 얻었습니다.","You didn't place, but you gained confidence.","入賞はできませんでしたが、自信がつきました。","虽然没得奖，却收获了自信。"]}]},

 {s:3,
  t:["결혼이나 동거 이야기가 오갑니다.","Talk of marriage or moving in together comes up.","結婚や同居の話が持ち上がります。","谈起了结婚或同居。"],

 {s:3,

 {s:3,ok:G=>G.s.e>=45,

 {s:3,ok:G=>G.c[4]<=1&&luck(G,32)<0.35,

 {s:3,

 {s:3,
  t:["작게라도 내 일을 시작할 기회가 보입니다.","You see a chance to start something of your own, however small.","小さくても自分の事業を始めるチャンスが見えます。","你看到了哪怕再小也能自己创业的机会。"],

 {s:4,

 {s:4,

 {s:4,

 {s:4,

 {s:4,ok:G=>G.s.h<70,
  t:["몸과 마음이 번아웃에 빠집니다.","Body and mind sink into burnout.","心身が燃え尽きてしまいます。","身心陷入了倦怠。"],

 {s:4,

      {l:["동네 학교에 보내고 곁에서 돌본다","Send them to the local school and stay close","地元の学校に通わせてそばで見守る","送去附近的学校，在身边陪着"],fx:{r:8,j:4},res:["평범하지만 따뜻한 성장기를 보냈습니다.","They had an ordinary but warm childhood.","平凡だけれど温かい成長期を過ごしました。","孩子度过了平凡却温暖的成长期。"]},
      {l:["일을 줄이고 직접 가르친다","Cut back work and teach them yourself","仕事を減らして自分で教える","减少工作，亲自教孩子"],fx:{r:9,w:-6,e:3},res:["아이와의 시간이 길어졌습니다.","You spent far more time with your child.","子どもと過ごす時間が長くなりました。","你陪孩子的时间变长了。"]}]},
 {s:4,

 {s:5,

function cultureOf(c){
  const iso=c[0]; if(CULT[iso]) return CULT[iso];
  const r=c[3]; // 0 동아시아 1 유럽 2 중남미 3 중동북아프리카 4 북미 5 남아시아 6 사하라이남
  return r===2?"es":r===3?"ar":r===5?"in":r===6?"af":r===1?"ru":r===0?"sea":"en";
}
function makeName(c,sex,rnd){
  const k=cultureOf(c), d=NM[k], pick=a=>a[Math.floor(rnd()*a.length)];
  const given=pick(d[sex]), sur=pick(d.sur);
  return (k==="ko"||k==="ja"||k==="zh")?sur+given:given+" "+sur;
}

function sceneSVG(g,age,opt={}){
  const id="sg"+(sceneN++), t=opt.t!=null?opt.t:clamp(age/100,0,1);
  const [a,b]=skyColors(t);
  const lift=Math.max(0,Math.round(600/(opt.ar||2.6)-220));
  const [sx,sy]=sunXY(t,lift);
  const hot=clamp((t-.7)/.3,0,1), night=clamp((t-.88)/.12,0,1);
  const main=opt.main?' id="msc"':"";
  const clouds=[[100,48,1],[318,30,.8],[492,58,1.15]].map(([x,y,k])=>`<g opacity="${(.8-night*.6).toFixed(2)}" transform="translate(${x},${y}) scale(${k})"><ellipse cx="0" cy="0" rx="26" ry="9" fill="#fff"/><ellipse cx="-12" cy="-6" rx="13" ry="10" fill="#fff"/><ellipse cx="10" cy="-8" rx="15" ry="12" fill="#fff"/></g>`).join("");
  const stars=[[60,20-lift*.6],[250,40-lift*.8],[450,10-lift*.4],[60,20],[130,45],[220,15],[310,35],[400,18],[470,42],[540,22],[90,70],[350,60],[510,80],[180,90],[580,60]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.5" fill="#fff"/>`).join("");
  const inner=g?sceneInner(g,age):"";
  return `<svg viewBox="0 ${-lift} 600 ${220+lift}" preserveAspectRatio="xMidYMax slice"${main} data-lift="${lift}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}" class="k0"/><stop offset="1" stop-color="${b}" class="k1"/></linearGradient></defs>`+
   `<rect y="${-lift}" width="600" height="${220+lift}" fill="url(#${id})"/><g class="stars" opacity="${night.toFixed(2)}">${stars}</g>`+
   `<circle class="halo" r="30" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" fill="#ffd36b" opacity=".25"/><circle class="sun" r="17" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" fill="rgb(255,${Math.round(211-hot*90)},${Math.round(107-hot*40)})"/>`+
   `<g class="clouds">${clouds}</g>`+
   `<g transform="translate(0,50)"><path d="M0 170V122C70 105 120 112 190 124S320 108 400 118 540 112 600 122V170Z" fill="var(--hill1)"/></g>`+
   `<g transform="translate(0,48)" class="world">${inner}</g>`+
   `<g transform="translate(0,62)"><path d="M0 160V150C90 140 150 146 230 150S380 140 470 147 560 144 600 147V160Z" fill="var(--hill2)"/></g></svg>`;
}
const sunXY=(t,lift)=>{const u=.06+.88*clamp(t,0,1);return [40+520*u,150-(118+lift*.75)*Math.sin(Math.PI*u)]};
let skyT=0, skyRaf=0;
function paintMain(t){
  const sv=document.getElementById("msc"); if(!sv) return;
  const [a,b]=skyColors(t);
  sv.querySelector(".k0").setAttribute("stop-color",a); sv.querySelector(".k1").setAttribute("stop-color",b);
  const [x,y]=sunXY(t,+sv.dataset.lift||0).map(v=>v.toFixed(1));
  for(const n of sv.querySelectorAll(".sun,.halo")){n.setAttribute("cx",x);n.setAttribute("cy",y)}
  const hot=clamp((t-.7)/.3,0,1), night=clamp((t-.88)/.12,0,1);
  sv.querySelector(".sun").setAttribute("fill",`rgb(255,${Math.round(211-hot*90)},${Math.round(107-hot*40)})`);
  sv.querySelector(".stars").setAttribute("opacity",night.toFixed(2));
  sv.querySelectorAll(".clouds>g").forEach(c=>c.setAttribute("opacity",(.8-night*.6).toFixed(2)));
}
/* 큰 장면: 처음 그릴 때는 이전 하늘에서 시작해 새 나이로 부드럽게 넘어가요 */
function drawMain(age,dur=900){
  const el=document.getElementById("pScene"); if(!el||!G) return;
  if(!document.getElementById("msc")) el.innerHTML=sceneSVG(G,age,{main:1,t:skyT,ar:el.clientWidth/el.clientHeight||2.3});
  else document.querySelector("#msc .world").innerHTML=sceneInner(G,age);
  const target=clamp(age/100,0,1), from=skyT;
  cancelAnimationFrame(skyRaf);
  if(Math.abs(target-from)<.001){skyT=target;paintMain(target);return}
  const t0=performance.now();
  const step=now=>{const u=clamp((now-t0)/sp(dur),0,1),e=1-Math.pow(1-u,3);skyT=from+(target-from)*e;paintMain(skyT);if(u<1) skyRaf=requestAnimationFrame(step)};
  skyRaf=requestAnimationFrame(step);
}
/* 도트 그림체: 좌표를 4칸 격자에 맞추고 원은 네모 블록으로 바꿔요 */
function pixelate(svg){
  const q=v=>Math.round(parseFloat(v)/4)*4;
  svg=svg.replace(/<circle cx="([-\d.]+)" cy="([-\d.]+)" r="([-\d.]+)"/g,(m,x,y,r)=>`<rect x="${q(x-r)}" y="${q(y-r)}" width="${Math.max(4,q(r*2))}" height="${Math.max(4,q(r*2))}"`);
  svg=svg.replace(/<rect ([^>]*?)\/?>/g,m=>m.replace(/\b(x|y|width|height)="([-\d.]+)"/g,(mm,k,v)=>`${k}="${k==="width"||k==="height"?Math.max(2,q(v)):q(v)}"`).replace(/ rx="[^"]*"/,""));
  return svg.replace(/<g /g,'<g shape-rendering="crispEdges" ');
}
function mapSVG(mode,hl){
  const M=MAP,W=M.cols*6,H=M.rows*6;
  const px=(lo,la)=>[(lo+180)/360*W,(M.lat0-la)/(M.lat0-M.lat1)*H];
  let land="";
  for(let r=0;r<M.rows;r++)for(let c=0;c<M.cols;c++){
    if(parseInt(M.hex[r*(M.cols/4)+(c>>2)],16)>>(3-(c&3))&1) land+=`M${c*6+3} ${r*6+3}h0`;
  }
  let dots="";
  if(mode==="all"){
    for(const c of COUNTRIES){
      const p=M.cen[c[0]]; if(!p) continue; const [x,y]=px(p[0],p[1]);
      const r=(2+Math.sqrt(c[5]/1e6)*2.6).toFixed(1);
      dots+=`<circle class="bd" style="animation-delay:${(c[5]%17)/6}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;
    }
  } else if(hl){
    const p=M.cen[hl]; if(p){const [x,y]=px(p[0],p[1]);
      dots=`<circle class="ring" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/><circle class="ring r2" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/><circle class="pin" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`;}
  }
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img"><path class="land" d="${land}"/>${dots}</svg>`;
}

const dark=()=>window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
const SKY_L=[[0,"#ffd9a8","#fff1d6"],[.1,"#f7c9b0","#ffe9cf"],[.14,"#a9cff5","#ffe7cc"],[.2,"#8ec5ff","#d6efff"],[.5,"#5aa9f0","#bfe3ff"],[.75,"#f3b36b","#ffe0b0"],[.9,"#d9776b","#f3b58c"],[1,"#2b2f5a","#6a5a8a"]];
const SKY_D=[[0,"#3a2a2a","#5a3f33"],[.12,"#3b3346","#5a4038"],[.2,"#1f3b5a","#2d5273"],[.5,"#153a63","#245a86"],[.75,"#5a3a1f","#8a5a2f"],[.9,"#4a2230","#7a3a3a"],[1,"#0d0f24","#23244a"]];
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function skyColors(t){
  const L=dark()?SKY_D:SKY_L; t=clamp(t,0,1);
  let i=0; while(i<L.length-2&&t>L[i+1][0]) i++;
  const a=L[i],b=L[i+1],u=(t-a[0])/(b[0]-a[0]);
  const mix=(x,y)=>"rgb("+hexRGB(x).map((v,k)=>Math.round(v+(hexRGB(y)[k]-v)*u)).join(",")+")";
  return [mix(a[1],b[1]),mix(a[2],b[2])];
}

function weightedBirth(){
  let x=rnd()*totalBirths;
  for(const c of COUNTRIES){ x-=c[5]; if(x<=0) return c; }
  return COUNTRIES[0];
}
function newLife(seed,force){
  rnd=seed?mulberry(seed):Math.random;
  const c=force&&force.c||weightedBirth();
  const inc=c[4], le=c[6], imr=c[7];
  let sex=rnd()<0.512?"m":"f"; if(force&&force.sex) sex=force.sex;
  let fam=clamp(Math.round([14,30,50,72][inc]+randn()*17)); if(force&&force.fam!=null) fam=force.fam;
  const famTier=fam<25?0:fam<48?1:fam<70?2:3;
  const imrP=(imr==null?[45,25,12,4][inc]:imr)/1000;
  let lifespan;
  if(rnd()<imrP) lifespan=Math.floor(rnd()*2);
  else if(rnd()<0.09+(3-inc)*0.02) lifespan=Math.floor(2+rnd()*Math.max(8,le-5));
  else lifespan=Math.round(clamp(le+7+randn()*10,15,108));
  if(sex==="f") lifespan=Math.min(110,lifespan+(lifespan>20?2:0));
  const urban=rnd()<[.35,.5,.7,.82][inc];
  const fert=c[9]!=null?c[9]:[4.5,3,2,1.6][inc];
  const sibs=Math.max(0,Math.round(fert-1+randn()*1.1));
  const mAge=Math.round(20+rnd()*14), fAge=mAge+Math.round(1+rnd()*7);
  const g={
    urban, sibs, mAge, fAge, shownAge:0, facts:{}, skin:["#f1c9a5","#dcab80","#b9825a","#8f5d3d","#6d4430"][Math.floor(rnd()*5)],
    daily:!!seed, seed:seed||0, locked:[], bio:[], date:seed?todayStr():"", job:null,
    c, sex, fam, famTier, lifespan, age:0, stageIdx:0,
    s:{h:clamp(60+randn()*10+(inc-1.5)*4),w:clamp(fam),j:clamp(55+randn()*8),r:clamp(50+randn()*12),e:clamp(fam*0.4+10)},
    log:[], cause:"", ended:null, rolled:false, hist:[]
  };
  g.pjob=parentJob(g);
  g.hist.push({a:0,...g.s});
  g.name=makeName(g.c,g.sex,rnd);
  rnd=Math.random;
  return g;
}
/* 같은 날 정반대 형편에서 태어난 아이: 내가 고른 만큼 같이 변하고, 출발만 달라요 */
function makeTwin(g){
  const r=mulberry(Math.abs(hashStr(g.name+g.c[0]+g.seed))+11);
  const up=g.c[4]<=1||g.famTier<=1;
  const pool=COUNTRIES.filter(c=>c[0]!==g.c[0]&&(up?c[4]===3:c[4]===0));
  let x=r()*pool.reduce((a,c)=>a+c[5],0), c=pool[0];
  for(const k of pool){x-=k[5];if(x<=0){c=k;break}}
  const t=newLife(Math.floor(r()*1e9)+1,{c,sex:g.sex,fam:up?Math.round(78+r()*15):Math.round(6+r()*14)});
  t.urban=up; t.s0={...t.s}; t.locked=0;
  return t;
}
function syncTwin(){
  const T=G.twin; if(!T) return null;
  const g0=G.hist[0];
  for(const k of STATKEYS) T.s[k]=clamp(T.s0[k]+(G.s[k]-g0[k]));
  T.age=G.age; T.stageIdx=G.stageIdx; T.job=G.job;
  if(!T.goneLogged&&twinAge(T)<G.age){
    T.goneLogged=true; const nm=shortName(T.name), a=twinAge(T), tc=T.c;
    G.log.push({a:G.age,f:()=>kj(ui(a<1?"tw_dead_log0":"tw_dead_log",{place:place(tc),name:esc(nm),age:a}),nm)});
  }
  return T;
}

function curveSVG(mx,anim,compact){
  const W=compact?340:600,H=compact?190:240,pad=compact?24:30; mx=Math.max(20,mx);
  const X=a=>pad+(W-pad*2)*a/mx, Y=v=>H-pad-(H-pad*2)*v/100;
  let g="";
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${pad}" x2="${W-pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" ${v?'stroke-dasharray="3 5"':""}/><text x="${pad-6}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="var(--mute)">${v}</text>`});
  STATKEYS.forEach((k,i)=>{
    const pts=G.hist.map(h=>`${X(h.a).toFixed(1)},${Y(h[k]).toFixed(1)}`).join(" ");
    g+=`<polyline ${anim?'class="cl" ':""}points="${pts}" fill="none" stroke="${STAT_COL[i]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="animation-delay:${i*.15}s"/>`;
    const l=G.hist[G.hist.length-1];g+=`<circle cx="${X(l.a).toFixed(1)}" cy="${Y(l[k]).toFixed(1)}" r="4.5" fill="${STAT_COL[i]}"/>`;
  });
  g+=`<text x="${pad}" y="${H-8}" font-size="12" fill="var(--mute)">0</text><text x="${W-pad}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--mute)">${ui("age_n",{n:mx})}</text>`;
  const names=ST();
  return `<svg viewBox="0 0 ${W} ${H}" class="curve">${g}</svg><div class="legend">${STATKEYS.map((k,i)=>`<span><i style="background:${STAT_COL[i]}"></i>${names[i]}</span>`).join("")}</div>`;
}

/* ---------- 진행 ---------- */
let queue=[], cur=null;
function startStage(){
  const st=STAGES[G.stageIdx];
  if(!st||G.lifespan<st.a) return ending();
  if(G.stageIdx===0){
    G.age=Math.min(2,G.lifespan);
    if(G.lifespan<=2) return ending();
    G.stageIdx++; return startStage();
  }
  let pool=EV.filter(e=>e.s===G.stageIdx&&(!e.ok||e.ok(G)));
  const forced=pool.filter(e=>e.jobs===1);
  pool=pool.filter(e=>e.jobs!==1);
  const er=G.daily?mulberry(G.seed+G.stageIdx*101):Math.random;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(er()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const n=Math.min(st.evs,pool.length+forced.length);
  const picked=forced.concat(pool.slice(0,n-forced.length));
  picked.sort((x,y)=>EV.indexOf(x)-EV.indexOf(y)); // 같은 단계 안에서는 정의 순서(직업 결정이 먼저)
  const end=Math.min(st.b,G.lifespan);
  queue=picked.map((e,i)=>({e,age:Math.min(end,Math.round(st.a+(end-st.a+1)*(i+0.5)/n))}));
  nextEvent();
}
function nextEvent(){
  if(!queue.length){
    const st=STAGES[G.stageIdx];
    G.age=Math.min(st.b,G.lifespan);
    if(G.lifespan<=st.b) return ending();
    G.stageIdx++; return startStage();
  }
  cur=queue.shift();
  G.age=Math.min(cur.age,G.lifespan);
  if(G.age>=G.lifespan) return ending();
  cur.ch=cur.e.jobs?jobChoices(G,cur.e):cur.e.ch;
  cur.logged=false;
  passYears(G.shownAge,G.age,()=>{G.shownAge=G.age;showEvent()});
}
function pickFact(from,to){
  const c=G.c,pl=()=>place(c),le=c[6];
  const cand=[
    [1,c[7]!=null,()=>ui("fact_imr",{place:pl(),n:Math.round(c[7])})],
    [20,c[8]!=null,()=>ui("fact_gdp",{place:pl(),n:Math.round(c[8]).toLocaleString(),w:Math.round(WORLD.gdp).toLocaleString()})],
    [28,c[9]!=null,()=>ui("fact_fert",{place:pl(),n:c[9].toFixed(2),w:WORLD.fert.toFixed(2)})],
    [45,true,()=>ui("fact_le",{place:pl(),n:le.toFixed(1),p:Math.round(to/le*100)})],
    [Math.ceil(le)+1,true,()=>ui("fact_le2",{place:pl(),n:le.toFixed(1),d:Math.round(to-le)})]];
  for(const [a,ok,f] of cand){ if(ok&&!G.facts[a]&&from<a&&to>=a){G.facts[a]=1;return f} }
  return null;
}
function passYears(from,to,done){
  const yrs=to-from, fact=pickFact(from,to);
  ensureDash();
  if(yrs<2&&!fact) return done();
  view=()=>{topPlay()};
  let finished=false,timer=0;
  const go=()=>{if(finished)return;finished=true;clearInterval(timer);done()};
  const [pre,post]=UI.age_n[LI].split("{n}");
  setEv(`<div class="pass"><p class="kick" style="justify-content:center">⏳ ${UI.pass_h[LI]}</p>
    <div class="pa">${pre.trim()?`<small>${pre.trim()}</small> `:""}<span id="pa">${from}</span><small>${post.trim()}</small></div>
    <div class="pbar"><i id="pbar" style="width:0"></i></div>
    <div id="pfact"></div><p class="cap" style="text-align:center">${UI.tap_skip[LI]}</p></div>`);
  $("pEv").onclick=go;
  const dur=sp(Math.min(1500,Math.max(500,yrs*70))), t0=performance.now();
  drawMain(to,Math.min(1500,Math.max(500,yrs*70)));
  timer=setInterval(()=>{
    const u=clamp((performance.now()-t0)/dur,0,1), a=Math.round(from+yrs*u);
    const pa=$("pa"); if(!pa){clearInterval(timer);return}
    pa.textContent=a; hudAge(a);
    $("pbar").style.width=(u*100)+"%";
    if(u>=1){clearInterval(timer);
      if(fact){const txt=fact();G.log.push({a:to,f:()=>"📊 "+fact()});
        $("pfact").innerHTML=`<div class="fact"><span>${UI.fact_label[LI]}</span>${txt}</div>`;
        setTimeout(go,sp(3200));
      } else setTimeout(go,sp(250));
    }
  },50);
}

function evQuestion(){
  const e=cur.e;
  if(!cur.logged) saveRun();

    <div class="choices">${cur.ch.map((c,i)=>{
      if(c.req&&!c.req(G)){
        if(!cur.logged) G.locked.push({a:G.age,l:c.l,why:c.why});
        return `<button class="ch locked" disabled><span class="n">🔒</span><span>${tr(c.l,G)}<span class="why">${tr(c.why,G)}</span></span></button>`;
      }
      return `<button class="ch" data-i="${i}"><span class="n">${i+1}</span><span>${tr(c.l,G)}</span></button>`;
    }).join("")}</div>${twinHTML()}`);
  if(!cur.logged){cur.logged=true;$("pLock").innerHTML=lockBox()}
  $("pTwin").innerHTML=twinBox();
  app.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  autoStep();

function choose(i){
  const e=cur.e, ch=cur.ch[i], prevS={...G.s};
  applyFx(ch.fx);
  if(ch.job) G.job=ch.job;
  let res=ch.res, died=false;
  if(ch.risk && luck(G,EV.indexOf(e)*7919)<ch.risk.p(G)){
    applyFx(ch.risk.fx); res=ch.risk.res||res;
    if(ch.risk.die){ G.lifespan=Math.min(G.lifespan,G.age+(rnd()<0.5?0:1)); G.cause=ch.risk.die; died=true; }
  }
  const age=G.age, q=e.t, lab=ch.l;
  G.log.push({a:age,f:()=>`${tr(q,G)} → <b>${tr(lab,G)}</b>`});
  const sum=Object.values(ch.fx||{}).reduce((s,v)=>s+Math.abs(v),0)+(died?30:0)+(ch.job?25:0);
  G.bio.push({a:age,l:lab,imp:sum,job:!!ch.job});
  if(G.s.h<=10&&G.age>5){ G.lifespan=Math.min(G.lifespan,G.age+Math.floor(rnd()*6)); G.cause=G.cause||"health"; }
  G.hist.push({a:G.age,...G.s});
  const dead=G.age>=G.lifespan, fx={};
  for(const k of STATKEYS){const d=Math.round(G.s[k])-Math.round(prevS[k]); if(d) fx[k]=d;}
  const evRes=()=>{
    setEv(`<p class="kick">${UI.result_k[LI]} · ${tr(lab,G)}</p><div class="result">${tr(res,G)}</div>${fxDeltas(fx)}
      <button class="go" id="cont">${dead?"…":UI.cont[LI]+" →"}</button>`);
    $("cont").onclick=()=>dead?ending():nextEvent();
    autoStep();
  };
  view=()=>{ensureDash(true);evRes()};
  topPlay(); hudAge(G.age);
  $("pStats").innerHTML=statsBox(prevS); animateStats();
  $("pReg").innerHTML=regHTML(); $("pLog").innerHTML=logBox(); $("pCurve").innerHTML=curveBox(); $("pTwin").innerHTML=twinBox();
  if(ch.job) drawMain(G.age);
  evRes();
}

function titleIdx(age){
  const s=G.s,score=(s.h+s.w+s.j+s.r+s.e)/5;
  if(age<5) return 0; if(age<18) return 1;
  if(s.w>=75&&s.j>=60) return 2; if(s.r>=75&&s.j>=60) return 3; if(s.e>=75) return 4; if(s.j>=70) return 5;
  if(s.w<25&&s.h<35) return 6; if(score>=60) return 7; if(score>=45) return 8; return 9;
}
function ending(){
  const age=Math.min(G.lifespan,110), le=G.c[6];
  if(!G.ended){
    const k=titleIdx(age), diff=age-le;
    const cause=G.cause||(age>=le?"full":age<le-15?"young":"years");
    G.ended={age,k,cause,diff};
    const text=UI.titles[k].map((t,i)=>sub(UI.share_text[i],{place:NAMES[G.c[0]][i],age,title:t}));
    G.ended.text=text;
    if(G.daily) store.set("daily",{date:G.date,text:UI.titles[k].map((t,i)=>`${NAMES[G.c[0]][i]} · ${sub(UI.age_n[i],{n:age})} · ${t}`)});
    if(G.hist[G.hist.length-1].a!==age) G.hist.push({a:age,...G.s});
    if(G.twin) syncTwin();
    keepLife(); clearRun();
  }
  AUTO=false; clearTimeout(autoT);
  view=renderEnding; renderEnding();
}

function bioLines(info){
  const key=G.bio.slice().sort((a,b)=>b.imp-a.imp).slice(0,G.job?2:3).sort((a,b)=>a.a-b.a);
  const lines=[]; if(G.name) lines.push("· "+G.name);
  lines.push(ui("card_born",{place:place(G.c),tier:UI.tiers[G.famTier][LI]}));
  if(G.job) lines.push(ui("card_job",{job:G.job.n[LI]}));
  for(const k of key) if(!k.job) lines.push(ui("card_choice",{a:k.a,l:tr(k.l,G)}));
  lines.push(ui("card_end",{age:info.age,cause:info.causeTxt}));
  if(G.twin) lines.push(ui(twinAge(G.twin)<1?"card_tw0":"card_tw",{place:place(G.twin.c),name:shortName(G.twin.name),age:twinAge(G.twin),m:G.twin.locked}));
  return lines;
}
function wrapText(ctx,text,w){
  const tokens=LANG==="en"?text.split(/(\s+)/):Array.from(text);
  const out=[];let line="";
  for(const t of tokens){
    if(ctx.measureText(line+t).width>w&&line.trim()){out.push(line.trimEnd());line=t.trim()?t:""}
    else line+=t;
  }
  if(line.trim()) out.push(line.trimEnd());
  return out;
}
function drawCard(info){
  const cv=document.getElementById("card"); if(!cv) return;
  const W=1080,H=1350,ctx=cv.getContext("2d");
  const FF='"Noto Serif KR","Noto Serif JP","Noto Serif SC","Noto Sans KR","Hiragino Mincho ProN","Songti SC","Malgun Gothic",serif';
  ctx.fillStyle="#f7f1e3";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#c4572a";ctx.lineWidth=4;ctx.strokeRect(48,48,W-96,H-96);
  ctx.fillStyle="#c4572a";ctx.font=`500 34px ${FF}`;
  ctx.fillText(G.daily?ui("card_daily",{d:G.date}):UI.title[LI],96,140);
  ctx.fillStyle="#1f1d19";ctx.font=`700 68px ${FF}`;
  let y=250; for(const l of wrapText(ctx,info.title,W-192)){ctx.fillText(l,96,y);y+=88}
  ctx.font=`400 44px ${FF}`;ctx.fillStyle="#3b372f";y+=40;
  for(const ln of bioLines(info)){ for(const l of wrapText(ctx,ln,W-192)){ctx.fillText(l,96,y);y+=68} y+=22 }
  ctx.strokeStyle="#ddd6c6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(96,H-250);ctx.lineTo(W-96,H-250);ctx.stroke();
  ctx.fillStyle="#8c8578";ctx.font=`400 30px ${FF}`;
  ctx.fillText(ui("card_foot",{n:G.locked.length,age:info.age}),96,H-190);
  ctx.fillText(UI.card_sub[LI],96,H-140);
  ctx.fillText(location.protocol.startsWith("http")?location.host+location.pathname.replace(/\/index\.html$/,"/"):SITE.replace(/^https:\/\//,""),96,H-96);
}

/* ---------- 한국어 조사: 이름 끝 받침에 맞추기 ---------- */
function hasBatchim(w){
  const ch=String(w).trim().slice(-1); if(!ch) return false;
  const code=ch.charCodeAt(0);
  if(code>=0xAC00&&code<=0xD7A3) return (code-0xAC00)%28!==0;
  if(/[a-z]/i.test(ch)) return /(n|m|l|ng)$/i.test(String(w).trim()); // 로마자 이름은 한글로 읽었을 때 끝소리 기준(대략)
  return false;
}
// "{name}{는}"처럼 쓴 자리를 이름에 맞는 조사로 바꿔요 (한국어 화면만)
const JOSA={"는":["은","는"],"가":["이","가"],"를":["을","를"],"와":["과","와"],"였":["이었","였"],"야":["이야","야"]};
function kj(s,name){
  return LI===0?s.replace(/\{(는|가|를|와|였|야)\}/g,(m,k)=>JOSA[k][hasBatchim(name)?0:1]):s.replace(/\{(는|가|를|와|였|야)\}/g,"");
}

const RUN_KEY="run", LIVES_KEY="lives", RUN_VER=()=>EV.length+"-"+STAGES.length+"-"+JOBS.length;
function freezeVal(v,key){
  if(typeof v==="function"){
    const keep=LI, out=[0,1,2,3].map(i=>{LI=i;try{const x=key==="f"?v():v(G);return Array.isArray(x)?x[i]:x}catch(e){return ""}});
    LI=keep; return {__t:out};
  }
  if(Array.isArray(v)) return v.map(x=>freezeVal(x));
  if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=freezeVal(v[k],k);return o}
  return v;
}
function thawVal(v,key){
  if(v&&typeof v==="object"&&!Array.isArray(v)&&v.__t){const t=v.__t;return key==="f"?()=>t[LI]:t}
  if(Array.isArray(v)) return v.map(x=>thawVal(x));
  if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=thawVal(v[k],k);return o}
  return v;
}
const jobIdx=j=>j?JOBS.indexOf(j):-1;
function packLife(g){
  const o=freezeVal({...g,c:g.c[0],pjob:jobIdx(g.pjob),job:jobIdx(g.job),ownJob:undefined,twin:null});
  if(g.twin) o.twin=packLife(g.twin);
  return o;
}
function unpackLife(o){
  const g=thawVal(o);
  g.c=COUNTRIES.find(x=>x[0]===o.c); g.pjob=JOBS[o.pjob]||JOBS[0]; g.job=o.job>=0?JOBS[o.job]:null;
  if(o.twin) g.twin=unpackLife(o.twin);
  return g;
}

  const ctry=new Set(list.map(x=>x.c)).size, yrs=list.reduce((s,x)=>s+x.a,0);
  const card=x=>{
    const c=COUNTRIES.find(k=>k[0]===x.c), tc=x.tw&&COUNTRIES.find(k=>k[0]===x.tw.c);
    return `<li><div class="lv-a">${ageParts(x.a)}</div><div class="lv-b"><b>${esc(x.n)}</b><span>${place(c)} · ${UI.sex_child[LI][x.s==="m"?0:1]} · ${UI.titles[x.k][LI]}</span>
      ${tc?`<small>🔀 ${esc(shortName(x.tw.n))} · ${place(tc)} · ${ui("age_n",{n:x.tw.a})} · ${UI.tw_doors[LI]} ${x.dl} : ${x.tw.dl}</small>`:""}</div><time>${x.d.slice(5).replace("-","/")}</time></li>`;
  };
  return `<section class="sec" id="lives">
    <div class="sec-h"><h2>${UI.lv_h[LI]}</h2><p>${ui("lv_p",{n:list.length,c:ctry,y:yrs.toLocaleString()})}</p></div>
    <div class="box"><ul class="lives">${list.slice(0,12).map(card).join("")}</ul>
    <div class="lv-f"><p class="cap">${UI.lv_note[LI]}</p><button class="ghost sm" id="lvClear">${UI.lv_clear[LI]}</button></div></div>
  </section>`;
}
function resumeHTML(){
  const r=savedRun(); if(!r) return "";
  const g=r.g, c=COUNTRIES.find(x=>x[0]===g.c);
  return `<div class="resume"><div><b>${UI.rs_h[LI]}</b><span>${esc(g.name)} · ${place(c)} · ${ui("age_n",{n:g.age})}</span></div><button class="cta sm" id="resume">${UI.rs_go[LI]} →</button></div>`;
}


function compareBox(){
  const T=G.twin; if(!T||!G.ended) return "";
  const me=G.ended.age, ta=twinAge(T), sn=shortName(T.name), tj=twinJob(T), R=UI.cmp_rows;
  const rows=[[R[0],place(G.c),place(T.c)],[R[1],UI.tiers[G.famTier][LI],UI.tiers[T.famTier][LI]],
    [R[2],ui("unit_yr",{n:me}),ui("unit_yr",{n:ta})],[R[3],ui("unit_yr",{n:G.c[6].toFixed(1)}),ui("unit_yr",{n:T.c[6].toFixed(1)})],
    [R[4],G.job?G.job.n[LI]:"—",tj?tj.n[LI]:"—"],[R[5],G.locked.length,T.locked]];
  const d=ta-me, line=kj(ui(ta<1?"tcmp_0":d<0?"tcmp_less":d>0?"tcmp_more":"tcmp_same",{name:esc(sn),n:Math.abs(d)}),sn);
  return `<div class="box cmp"><div class="box-h"><h3>🔀 ${UI.cmp_h[LI]}</h3></div>
    <table><thead><tr><th></th><th>${UI.cmp_you[LI]}</th><th>${esc(sn)}</th></tr></thead>
    <tbody>${rows.map(([k,a,b])=>`<tr><th>${k[LI]}</th><td>${a}</td><td class="t">${b}</td></tr>`).join("")}</tbody></table>
    <p class="cmp-l">${line}</p><p class="cap">${UI.cmp_p[LI]}</p></div>`;
}

async function sendToChat(btn){
  const url=shareURL(), txt=shareText();
  if(navigator.share){ try{ await navigator.share({text:txt,url}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(txt+"\n"+url); btn.querySelector("small").textContent=UI.chat_copied[LI]; }
  catch(_){ prompt(UI.copy[LI],txt+"\n"+url); }
}
