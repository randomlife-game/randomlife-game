<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤인생게임 · Random Life</title>
<meta name="description" content="80억 명 중 한 명으로 무작위로 태어나 일생을 살아 보는 게임 · Be born as one of 8 billion and live a whole life · 80億人の中の一人として生まれ、一生を生きるゲーム · 成为80亿人中的一个，过完一生">

<meta property="og:title" content="랜덤인생게임 · Random Life · ランダム人生 · 随机人生">
<meta property="og:description" content="Who will you be out of 8 billion? 80억 명 중 당신은 누가 될까요? 80億人の中で、あなたは誰になる？ 80亿人里，你会成为谁？">

<style>
  :root{
    --bg:#f5f2ea; --surface:#fff; --ink:#1f1d19; --soft:#58534a; --muted:#8c8578;
    --line:#ddd6c6; --accent:#a8742a; --accent-soft:#efe0c3; --land:#cfc6b2; --hill1:#7a8f5a; --hill2:#58714a; --up:#2f8a57; --dn:#c0453f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14120f; --surface:#1e1b16; --ink:#ede7da; --soft:#c3bba9; --muted:#8a8170;
      --line:#383025; --accent:#d3a352; --accent-soft:#33290f; --land:#3a3328; --hill1:#2e3a28; --hill2:#202a1f; --up:#6cc58f; --dn:#e07f78; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP","Noto Sans SC","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;color:var(--accent);margin:0 0 8px;letter-spacing:.02em}
  .big{font-size:22px;font-weight:700;margin:2px 0 6px}
  .q{font-size:18px;margin-bottom:6px}
  button,.btn{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;text-decoration:none}
  .btn:hover,.btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  .primary{background:var(--accent);color:#fff;border:0;text-align:center;font-weight:700;padding:14px}
  .primary:hover{background:var(--accent);filter:brightness(1.1)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--soft)}
  .stat b{display:block;font-size:17px;color:var(--ink)}
  .bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .age{font-size:13px;color:var(--muted);margin-bottom:8px}
  .res{border-left:3px solid var(--accent);padding:4px 12px;margin:12px 0;color:var(--soft)}
  .log{font-size:14px;color:var(--soft);margin:0;padding:0;list-style:none}
  .log li{padding:5px 0;border-bottom:1px dashed var(--line)}
  .log li span{color:var(--accent);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
  .log li span.mut,.mut{color:var(--muted);font-weight:400}
  .tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;margin:0 4px 4px 0}
  .fx{font-size:12px;color:var(--muted);margin-top:6px}
  .note{font-size:12px;color:var(--muted);margin-top:24px}
  .btn.locked{opacity:.55;border-style:dashed;cursor:not-allowed}
  .btn.locked:hover{background:var(--surface);border-color:var(--line)}
  canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
  .row{display:flex;gap:8px}.row .btn{text-align:center}
  .sns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
  .sns .btn{text-align:center;margin:0}
  .friend{border-color:var(--accent);background:var(--accent-soft)}
  .langs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:14px}
  .langs button{font-size:13px;background:var(--surface);color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
  .langs .sep{flex:1}.langs{align-items:center}
  .nm{width:100%;font:inherit;font-size:20px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  body.px .card,body.px .btn,body.px .stat,body.px .hero,body.px .sky,body.px .map,body.px .fact,body.px .scene,body.px .nm{border-radius:0}
  body.px .card,body.px .btn{border-width:2px;box-shadow:3px 3px 0 var(--line)}
  body.px .bar,body.px .bar i,body.px .ibar,body.px .ibar i{border-radius:0}
  body.px .sky svg,body.px #world{image-rendering:pixelated}
  .langs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #langs{max-width:640px}
  .hero{margin:0 0 16px;border-radius:14px;overflow:hidden;position:relative}
  .map{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .map .land{fill:none;stroke:var(--land);stroke-width:4.6;stroke-linecap:round}
  .map .bd{fill:var(--accent);opacity:.35;animation:tw 3.2s ease-in-out infinite}
  .map .ring{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  .map .ring.r2{animation-delay:1s}
  .map .pin{fill:var(--accent);stroke:var(--surface);stroke-width:2}
  .mapcap{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;font-size:12px;color:var(--soft);background:linear-gradient(transparent,var(--surface) 70%)}
  .mapcap:empty{display:none}
  .sky{aspect-ratio:600/170;border-radius:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
  .sky svg{display:block;width:100%;height:100%}
  .skycap{position:absolute;left:12px;top:8px;font-size:12px;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .scene{margin:-20px -20px 14px;height:96px;border-radius:14px 14px 0 0;position:relative;display:flex;align-items:center;justify-content:center}
  .scene .emo{font-size:52px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
  .scene .stg{position:absolute;left:12px;top:8px;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .card.ev{overflow:hidden}
  .stat{position:relative}
  .stat .si{font-size:18px;line-height:1;margin-bottom:2px}
  .bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .chip{position:absolute;top:-8px;right:-4px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;color:#fff;animation:rise .5s ease both}
  .chip.up{background:var(--up)}.chip.dn{background:var(--dn)}
  .pop{animation:pop .45s ease both}
  .ind{margin:10px 0}.il{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}.il b{color:var(--ink)}
  .ibar{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:4px}
  .ibar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .ibar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.55;text-decoration:none}
  .pass{text-align:center;cursor:pointer}
  .pa{font-size:56px;font-weight:700;line-height:1.1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
  .pa small{font-size:18px;font-weight:500;color:var(--muted);margin-left:6px}
  .fact{margin-top:14px;text-align:left;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);animation:rise .4s ease both}
  .fact span{display:block;font-size:11px;color:var(--accent);font-weight:700;margin-bottom:2px}
  .src a{color:var(--accent)}
  .roll .big{font-size:30px;text-align:center;padding:14px 0;min-height:72px}
  .curve{width:100%;height:auto;display:block}
  .cl{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease forwards}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
  #app>*{animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @keyframes bob{50%{transform:translateY(-5px)}}
  @keyframes tw{50%{opacity:.12}}
  @keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.cl{stroke-dashoffset:0}}
  @media (max-width:420px){.stats{gap:5px}.stat{padding:6px 2px;font-size:11px}.stat b{font-size:15px}.chip{right:-2px;padding:0 5px}}
</style>
</head>

function wsample(arr,n,wf,rf){
  const pool=arr.slice(),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((s,x)=>s+wf(x),0);let x=rf()*tot,i=0;
    for(;i<pool.length;i++){x-=wf(pool[i]);if(x<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}

  return wsample(pool,1,j=>jobW(j,G)*(G.famTier>=2&&(j.e||0)>=45?2:1),rnd)[0];

function jobChoices(G,e){

  const ch=offers.map(j=>({l:j.n,fx:j.fx,job:j,res:ui("job_res",{job:j.n[LI]})}));
  if(locked.length){

    ch.push({l:j.n,req:()=>false,why:UI[why]});
  }
  if(e.jobs===2) ch.push({l:UI.job_keep,fx:{w:2},res:UI.job_keep});
  return ch;
}

      {l:["도서관에서 책을 빌려 읽는다","Borrow and read books at the library","図書館で本を借りて読む","在图书馆借书读"],fx:{e:6,j:3},res:["도서관이 놀이터가 됐습니다.","The library became your playground.","図書館が遊び場になりました。","图书馆成了你的游乐场。"]},
      {l:["친구들과 뛰어논다","Run around with friends","友だちと駆け回る","和朋友疯玩"],fx:{r:8,h:3,e:-1},res:["해가 질 때까지 놀았습니다.","You played until sunset.","日が暮れるまで遊びました。","你玩到太阳落山。"]}]},
 {s:1,
  t:["동생이 태어났습니다.","A younger sibling is born.","弟か妹が生まれました。","弟弟或妹妹出生了。"],
  ch:[{l:["동생을 열심히 돌본다","Look after the baby eagerly","弟妹を一生懸命世話する","认真照顾弟妹"],fx:{r:8,j:3,e:-2},res:["든든한 형 누나가 됐습니다.","You became a dependable older sibling.","頼もしい兄や姉になりました。","你成了可靠的哥哥姐姐。"]},
      {l:["내 몫을 지키려 투정을 부린다","Throw tantrums to protect your share","自分の分を守ろうとわがままを言う","为了守住自己那份而耍脾气"],fx:{r:-3,j:2},res:["한동안 집안이 시끄러웠습니다.","The house was noisy for a while.","しばらく家の中が騒がしくなりました。","家里吵闹了一阵子。"]}]},
 /* 청소년기 */
 {s:2,
  t:G=>pk(G,["학교에서 진로 이야기가 나옵니다. 주변에는 일찍 일터로 가는 아이도 많습니다.","Talk of the future comes up at school. Many kids around you head to work early.","学校で進路の話が出ます。周りには早くから働きに出る子も多くいます。","学校里开始谈论前途。你身边不少孩子很早就去干活了。"],["학교에서 진로 이야기가 나옵니다. 성적과 학원 이야기가 한창입니다.","Talk of the future comes up at school. Grades and cram schools are all anyone discusses.","学校で進路の話が出ます。成績や塾の話題でもちきりです。","学校里开始谈论前途，成绩和补习班是热门话题。"]),
  ch:[{l:["공부에 매달린다","Throw yourself into studying","勉強に打ち込む","埋头苦读"],fx:{e:14,h:-4,j:-3},res:["성적은 올랐지만 몸과 마음이 지쳤습니다.","Your grades rose, but body and mind wore out.","成績は上がりましたが、心身が疲れ果てました。","成绩上去了，身心却疲惫不堪。"]},
      {l:["기술을 배우며 일을 시작한다","Start working while learning a trade","技術を学びながら働き始める","边学手艺边开始工作"],fx:{w:8,e:4,r:3},res:["일찍 손에 익은 기술이 생겼습니다.","You picked up a skill early on.","早くから身についた技術ができました。","你早早练就了一门手艺。"]},
      {l:["균형 있게 지낸다","Keep a balance","バランスよく過ごす","保持平衡"],fx:{e:6,j:5,r:4},res:["무난한 청소년기를 보냈습니다.","You had an uneventful adolescence.","無難な思春期を過ごしました。","你度过了平稳的青少年时期。"]},
      {l:["해외 대학에 지원한다","Apply to a university abroad","海外の大学に出願する","申请海外大学"],req:G=>G.famTier>=2||G.s.e>=75,why:["학비와 입학 정보가 있어야 열려요","It takes tuition money and admission know-how","学費と入学情報が必要です","需要学费和入学信息"],fx:{e:16,w:-6,r:-4},res:["낯선 나라의 캠퍼스를 꿈꾸게 됐습니다.","You started dreaming of a campus in a faraway country.","見知らぬ国のキャンパスを夢見るようになりました。","你开始向往异国的校园。"]}]},
 {s:2,ok:G=>G.famTier<=2&&luck(G,31)<0.6,
  t:["집안 사정이 갑자기 어려워졌습니다.","Your family's circumstances suddenly turn hard.","家の事情が急に厳しくなりました。","家里的境况忽然变得艰难。"],
  ch:[{l:["학업을 잠시 접고 일한다","Set school aside and go to work","学業をいったん諦めて働く","暂时放下学业去打工"],fx:{w:10,e:-8,j:-4},res:["가족을 위해 일터로 나갔습니다.","You went to work for your family.","家族のために働きに出ました。","你为了家人走进了工地和店铺。"]},
      {l:["장학금과 친척 도움을 알아본다","Look into scholarships and help from relatives","奨学金や親戚の助けを探す","打听奖学金和亲戚的帮助"],fx:{e:5,w:-2,r:3},res:["어렵게 학교를 이어 갔습니다.","You managed to stay in school, barely.","苦労しながら学校を続けました。","你艰难地把书念了下去。"],risk:{p:G=>0.35,fx:{e:-8,j:-4},res:["도움은 닿지 않았고 결국 학업을 중단했습니다.","Help never came, and you left school in the end.","助けは届かず、結局学業を中断しました。","帮助没能到来，你最终还是辍学了。"]}}]},
 {s:2,
  t:["처음으로 마음이 가는 사람이 생겼습니다.","For the first time, someone catches your heart.","初めて、気になる人ができました。","你第一次有了心动的人。"],
  ch:[{l:["용기 내어 고백한다","Gather your courage and confess","勇気を出して告白する","鼓起勇气表白"],fx:{r:7,j:6},res:["결과가 어떻든 잊지 못할 경험이 됐습니다.","Whatever the result, it became an unforgettable experience.","結果がどうあれ、忘れられない経験になりました。","不论结果如何，这都成了难忘的经历。"],risk:{p:G=>0.4,fx:{j:-8,r:-3},res:["거절당해 한동안 마음이 쓰렸습니다.","You were turned down and hurt for a while.","断られて、しばらく胸が痛みました。","你被拒绝了，难过了好一阵子。"]}},
      {l:["혼자 마음에 담아 둔다","Keep it to yourself","一人で胸にしまっておく","把心意藏在心里"],fx:{j:-1,e:3},res:["일기장에만 이름을 적었습니다.","You wrote the name only in your diary.","名前は日記にだけ書きました。","你只在日记里写下了那个名字。"]}]},
 {s:2,
  t:["또래들이 위험한 일탈을 함께 하자고 합니다.","Your peers invite you to join in something risky.","同世代の子たちが危ない悪ふざけに誘います。","同龄人邀你一起做危险的出格事。"],
  ch:[{l:["함께 어울린다","Join them","一緒に加わる","一起去"],fx:{r:6,j:5,h:-5},res:["짜릿했지만 후폭풍이 따랐습니다.","It was thrilling, but there were consequences.","スリルはありましたが、後で痛い目を見ました。","很刺激，但随后付出了代价。"],risk:{p:G=>0.25,fx:{h:-10,e:-8},res:["사고가 나 크게 다쳤습니다.","There was an accident and you were badly hurt.","事故が起きて大けがをしました。","出了事故，你受了重伤。"]}},
      {l:["거절한다","Refuse","断る","拒绝"],fx:{r:-4,e:4},res:["친구 몇 명을 잃었지만 자신을 지켰습니다.","You lost a few friends but protected yourself.","友だちを何人か失いましたが、自分を守りました。","你失去了几个朋友，却守住了自己。"]}]},
 {s:2,
  t:G=>{const n=nmA(G);return pk(G,[`${n[0]}에서는 학교가 멀고 시설이 부족해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, schools are far and poorly equipped, so choices are hard. You consider going on to higher school.`,`${n[2]}では学校が遠く設備も足りず、選択は簡単ではありません。進学を考えます。`,`在${n[3]}，学校远、设施少，选择并不容易。你考虑继续升学。`],[`${n[0]}에서는 입시 경쟁이 치열해 선택이 쉽지 않습니다. 상급학교 진학을 준비합니다.`,`In ${n[1]}, entrance competition is fierce, so choices are hard. You prepare to go on to higher school.`,`${n[2]}では受験競争が激しく、選択は簡単ではありません。進学を準備します。`,`在${n[3]}，升学竞争激烈，选择并不容易。你准备继续升学。`])},
  ch:[{l:["끝까지 도전한다","Go for it to the end","最後まで挑戦する","拼到最后"],fx:{e:12,j:-3,w:-4},res:["고생 끝에 진학의 문턱에 닿았습니다.","After much hardship, you reached the threshold of further study.","苦労の末、進学の入り口にたどり着きました。","历经辛苦，你摸到了升学的门槛。"],risk:{p:G=>poor(G)?0.45:0.2,fx:{e:-2,j:-6},res:["원하는 곳에 가지 못해 낙담했습니다.","You didn't get into the place you wanted and felt crushed.","希望の進学先に行けず、落ち込みました。","没能进入想去的学校，你很沮丧。"]}},
      {l:["현실적인 길을 택한다","Take the realistic path","現実的な道を選ぶ","选择现实的路"],fx:{w:6,e:3},res:["안정적인 직업 훈련 쪽으로 방향을 잡았습니다.","You steered toward stable vocational training.","安定した職業訓練の方へ舵を切りました。","你转向了稳妥的职业培训。"]}]},
 {s:2,
  t:["세상과 연결된 화면 하나가 생겼습니다.","A screen that connects you to the world comes into your life.","世界とつながる画面が一つ手に入りました。","你有了一块连接世界的屏幕。"],
  ch:[{l:["온라인 강의를 듣는다","Take online lessons","オンライン講義を受ける","听网课"],req:G=>G.c[4]>=2||G.s.w>=45,why:["기기와 안정적인 인터넷이 필요해요","It takes a device and a stable connection","端末と安定したネット回線が必要です","需要设备和稳定的网络"],fx:{e:10,j:2},res:["집에서도 먼 세계의 수업을 들었습니다.","From home, you sat in classes from distant places.","家にいながら遠い世界の授業を受けました。","你在家就听到了远方世界的课。"]},
      {l:["친구 휴대폰으로 잠깐씩 본다","Borrow a friend's phone for short looks","友だちの携帯を借りて少しだけ見る","借朋友的手机偶尔看看"],fx:{e:3,r:4},res:["짧은 시간이었지만 많은 걸 알게 됐습니다.","The time was short, but you learned a lot.","短い時間でしたが、多くのことを知りました。","时间虽短，你却学到了很多。"]},
      {l:["책과 필기만으로 공부한다","Study with only books and notes","本とノートだけで勉強する","只靠书和笔记学习"],fx:{e:5,h:1},res:["느리지만 꾸준히 쌓았습니다.","It was slow, but you built it up steadily.","遅くても着実に積み上げました。","虽然慢，却一点点稳稳积累。"]}]},
 {s:2,ok:G=>G.s.e>=40,
  t:["학교에서 큰 대회와 교류 프로그램 소식이 들려옵니다.","News of a big competition and an exchange program reaches your school.","学校に大きな大会と交流プログラムの知らせが届きます。","学校传来了大型比赛和交流项目的消息。"],
  ch:[{l:["교환학생으로 떠난다","Leave as an exchange student","交換留学生として旅立つ","去做交换生"],req:G=>G.s.w>=60,why:["체류 비용을 댈 수 있어야 해요","It takes money to live abroad","滞在費を出せることが必要です","需要付得起在外生活的费用"],fx:{e:12,r:-4,j:6},res:["다른 나라의 교실에서 한 해를 보냈습니다.","You spent a year in a classroom in another country.","他の国の教室で一年を過ごしました。","你在另一个国家的教室里度过了一年。"]},
      {l:["국내 대회에 도전한다","Enter a domestic competition","国内の大会に挑戦する","参加国内比赛"],fx:{e:8,j:4},res:["입상은 못 했지만 자신감을 얻었습니다.","You didn't place, but you gained confidence.","入賞はできませんでしたが、自信がつきました。","虽然没得奖，却收获了自信。"]}]},
 /* 청년기 */
 {s:3,jobs:1,t:G=>UI.job_h.map(x=>sub(x,{place:NAMES[G.c[0]][UI.job_h.indexOf(x)]})),ch:[]},
 {s:3,
  t:["결혼이나 동거 이야기가 오갑니다.","Talk of marriage or moving in together comes up.","結婚や同居の話が持ち上がります。","谈起了结婚或同居。"],
  ch:[{l:["함께하기로 한다","Decide to build a life together","一緒になることにする","决定在一起"],fx:{r:14,j:6,w:-4},res:["가정을 이뤘습니다.","You started a household.","家庭を築きました。","你们组成了家庭。"]},
      {l:["아직은 혼자가 좋다","Prefer to stay on your own for now","まだ一人がいい","暂时还想一个人"],fx:{j:3,w:4,r:-3},res:["자기 시간을 더 쌓기로 했습니다.","You chose to build more time for yourself.","自分の時間をもっと積み重ねることにしました。","你决定先多积累属于自己的时间。"]}]},
 {s:3,
  t:["몸이 보내는 이상 신호가 느껴집니다.","Your body sends worrying signals.","体が異変のサインを送ってきます。","你的身体发出了异常的信号。"],
  ch:[{l:["검진을 받는다","Get a checkup","検診を受ける","去做检查"],fx:{h:6,w:-3},res:["일찍 발견해 큰 문제를 막았습니다.","You caught it early and avoided a bigger problem.","早く見つかって、大きな問題を防げました。","发现得早，避免了大问题。"]},
      {l:["일이 바빠 미룬다","Put it off because work is busy","仕事が忙しくて先延ばしにする","工作太忙，先拖着"],fx:{w:3,h:-6},res:["잠깐 괜찮아진 듯했습니다.","It seemed fine for a while.","しばらくは大丈夫なように見えました。","一时似乎没事了。"],risk:{p:G=>lowInc(G)?0.12:0.06,fx:{h:-14},res:["병이 깊어졌습니다.","The illness grew worse.","病気が深刻になりました。","病情加重了。"]}}]},
 {s:3,ok:G=>G.s.e>=45,
  t:["큰 기회가 찾아옵니다. 해외 연수·장학·이민 중 하나입니다.","A big chance arrives: overseas training, a scholarship, or emigration.","大きなチャンスが訪れます。海外研修、奨学金、移住のいずれかです。","一个大机会出现了：海外研修、奖学金或移民。"],
  ch:[{l:["붙잡는다","Grab it","つかみ取る","抓住它"],fx:{e:10,w:8,r:-5},res:["세상이 훨씬 넓어졌습니다.","Your world grew much wider.","世界がずっと広がりました。","世界一下子宽阔了许多。"]},
      {l:["가족 곁에 남는다","Stay near your family","家族のそばに残る","留在家人身边"],fx:{r:8,j:3},res:["익숙한 사람들 곁이 편했습니다.","Being among familiar people felt right.","慣れ親しんだ人たちのそばは心地よいものでした。","待在熟悉的人身边令人安心。"]}]},
 {s:3,ok:G=>G.c[4]<=1&&luck(G,32)<0.35,
  t:["분쟁과 불안이 사회를 뒤흔듭니다.","Conflict and unrest shake society.","紛争と不安が社会を揺さぶります。","冲突与动荡撼动着社会。"],
  ch:[{l:["안전한 곳으로 피신한다","Flee to somewhere safe","安全な場所へ避難する","逃往安全的地方"],fx:{w:-10,h:2,r:-4},res:["가진 것을 두고 떠났습니다.","You left what you owned behind.","持っていたものを置いて旅立ちました。","你抛下了所有家当离开。"]},
      {l:["버티며 일상을 지킨다","Stay and hold onto daily life","耐えて日常を守る","留下来守住日常"],fx:{j:-4,r:6},res:["이웃과 서로 의지했습니다.","You leaned on your neighbors and they on you.","隣人と支え合いました。","你和邻居们互相依靠。"],risk:{p:G=>0.18,fx:{h:-18},res:["크게 다쳤습니다.","You were badly hurt.","大けがをしました。","你受了重伤。"],die:"war"}}]},
 {s:3,
  t:["독립해서 살 곳을 구해야 합니다.","You need to find a place of your own.","独り立ちして住む場所を探さなければなりません。","你得找个自己的住处了。"],
  ch:[{l:["작은 월셋방을 얻는다","Rent a small room","小さな賃貸の部屋を借りる","租一间小屋"],fx:{w:-4,j:2},res:["좁지만 내 공간이 생겼습니다.","It was cramped, but it was yours.","狭いけれど、自分の空間ができました。","虽然窄，却是属于你的空间。"]},
      {l:["가족이 보증금을 대 준다","Your family covers the deposit","家族が保証金を出してくれる","家人替你付押金"],req:G=>G.famTier>=2,why:["보증금을 댈 사람이 있어야 해요","Someone has to be able to pay the deposit","保証金を出してくれる人が必要です","需要有人能替你付押金"],fx:{w:6,j:4},res:["좋은 동네에서 출발했습니다.","You started out in a good neighborhood.","良い街でスタートを切りました。","你从一个好社区起步。"]},
      {l:["친구들과 방 하나를 나눠 쓴다","Share one room with friends","友だちと一部屋をシェアする","和朋友合住一间房"],fx:{r:8,w:-1,j:-1},res:["북적이지만 외롭지 않았습니다.","It was crowded, but you were never lonely.","騒がしいけれど、寂しくはありませんでした。","虽然拥挤，却并不孤单。"]}]},
 {s:3,
  t:["작게라도 내 일을 시작할 기회가 보입니다.","You see a chance to start something of your own, however small.","小さくても自分の事業を始めるチャンスが見えます。","你看到了哪怕再小也能自己创业的机会。"],
  ch:[{l:["대출을 받아 가게를 연다","Take a loan and open a shop","融資を受けて店を開く","贷款开一家店"],req:G=>G.s.w>=40,why:["담보나 신용이 있어야 해요","It takes collateral or credit","担保や信用が必要です","需要抵押或信用"],fx:{w:10,j:3},res:["가게 문을 열었습니다.","You opened your shop.","店を開きました。","你的店开张了。"],risk:{p:G=>0.4,fx:{w:-14,j:-6},res:["빚만 남기고 문을 닫았습니다.","It closed, leaving only debt.","借金だけを残して店を閉めました。","店关了门，只剩下债。"]}},
      {l:["동료들과 작은 모임으로 시작한다","Start small with a group of peers","仲間と小さな集まりから始める","和同伴从小组起步"],fx:{r:8,w:3},res:["적은 돈으로 조금씩 키워 갔습니다.","You grew it bit by bit on little money.","わずかなお金で少しずつ育てていきました。","你用很少的钱一点点把它做大。"]},

 {s:4,

 {s:4,

 {s:4,ok:G=>G.s.h<70,

 {s:4,

 {s:4,

 {s:6,

function weightedBirth(){
  let x=rnd()*totalBirths;
  for(const c of COUNTRIES){ x-=c[5]; if(x<=0) return c; }
  return COUNTRIES[0];
}
function newLife(seed){
  rnd=seed?mulberry(seed):Math.random;
  const c=weightedBirth();
  const inc=c[4], le=c[6], imr=c[7];
  const sex=rnd()<0.512?"m":"f";
  const fam=clamp(Math.round([14,30,50,72][inc]+randn()*17));
  const famTier=fam<25?0:fam<48?1:fam<70?2:3;
  const imrP=(imr==null?[45,25,12,4][inc]:imr)/1000;
  let lifespan;
  if(rnd()<imrP) lifespan=Math.floor(rnd()*2);
  else if(rnd()<0.09+(3-inc)*0.02) lifespan=Math.floor(2+rnd()*Math.max(8,le-5));
  else lifespan=Math.round(clamp(le+7+randn()*10,15,108));
  if(sex==="f") lifespan=Math.min(110,lifespan+(lifespan>20?2:0));
  const urban=rnd()<[.35,.5,.7,.82][inc];
  const fert=c[9]!=null?c[9]:[4.5,3,2,1.6][inc];
  const sibs=Math.max(0,Math.round(fert-1+randn()*1.1));
  const mAge=Math.round(20+rnd()*14), fAge=mAge+Math.round(1+rnd()*7);
  const g={
    urban, sibs, mAge, fAge, shownAge:0, facts:{}, skin:["#f1c9a5","#dcab80","#b9825a","#8f5d3d","#6d4430"][Math.floor(rnd()*5)],
    daily:!!seed, seed:seed||0, locked:[], bio:[], date:seed?todayStr():"", job:null,
    c, sex, fam, famTier, lifespan, age:0, stageIdx:0,
    s:{h:clamp(60+randn()*10+(inc-1.5)*4),w:clamp(fam),j:clamp(55+randn()*8),r:clamp(50+randn()*12),e:clamp(fam*0.4+10)},
    log:[], cause:"", ended:null, rolled:false, hist:[]
  };
  g.pjob=parentJob(g);
  g.hist.push({a:0,...g.s});
  g.name=makeName(g.c,g.sex,rnd);
  rnd=Math.random;
  return g;
}

/* ---------- 진행 ---------- */
let queue=[], cur=null;
function startStage(){
  const st=STAGES[G.stageIdx];
  if(!st||G.lifespan<st.a) return ending();
  if(G.stageIdx===0){
    G.age=Math.min(2,G.lifespan);
    if(G.lifespan<=2) return ending();
    G.stageIdx++; return startStage();
  }
  let pool=EV.filter(e=>e.s===G.stageIdx&&(!e.ok||e.ok(G)));
  const forced=pool.filter(e=>e.jobs===1);
  pool=pool.filter(e=>e.jobs!==1);
  const er=G.daily?mulberry(G.seed+G.stageIdx*101):Math.random;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(er()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const n=Math.min(st.evs,pool.length+forced.length);
  const picked=forced.concat(pool.slice(0,n-forced.length));
  picked.sort((x,y)=>EV.indexOf(x)-EV.indexOf(y)); // 같은 단계 안에서는 정의 순서(직업 결정이 먼저)
  const end=Math.min(st.b,G.lifespan);
  queue=picked.map((e,i)=>({e,age:Math.min(end,Math.round(st.a+(end-st.a+1)*(i+0.5)/n))}));
  nextEvent();
}
function nextEvent(){
  if(!queue.length){
    const st=STAGES[G.stageIdx];
    G.age=Math.min(st.b,G.lifespan);
    if(G.lifespan<=st.b) return ending();
    G.stageIdx++; return startStage();
  }
  cur=queue.shift();
  G.age=Math.min(cur.age,G.lifespan);
  if(G.age>=G.lifespan) return ending();
  cur.ch=cur.e.jobs?jobChoices(G,cur.e):cur.e.ch;
  cur.logged=false;
  passYears(G.shownAge,G.age,()=>{G.shownAge=G.age;showEvent()});
}
function pickFact(from,to){
  const c=G.c,pl=()=>place(c),le=c[6];
  const cand=[
    [1,c[7]!=null,()=>ui("fact_imr",{place:pl(),n:Math.round(c[7])})],
    [20,c[8]!=null,()=>ui("fact_gdp",{place:pl(),n:Math.round(c[8]).toLocaleString(),w:Math.round(WORLD.gdp).toLocaleString()})],
    [28,c[9]!=null,()=>ui("fact_fert",{place:pl(),n:c[9].toFixed(2),w:WORLD.fert.toFixed(2)})],
    [45,true,()=>ui("fact_le",{place:pl(),n:le.toFixed(1),p:Math.round(to/le*100)})],
    [Math.ceil(le)+1,true,()=>ui("fact_le2",{place:pl(),n:le.toFixed(1),d:Math.round(to-le)})]];
  for(const [a,ok,f] of cand){ if(ok&&!G.facts[a]&&from<a&&to>=a){G.facts[a]=1;return f} }
  return null;
}
function passYears(from,to,done){
  const yrs=to-from, fact=pickFact(from,to);
  if(yrs<2&&!fact) return done();
  view=()=>{};
  let finished=false,timer=0;
  const go=()=>{if(finished)return;finished=true;clearInterval(timer);done()};
  show(`<div class="card pass"><h2>${UI.pass_h[LI]}</h2>

      document.querySelector(".pass").onclick=go;
      const dur=sp(Math.min(1500,Math.max(500,yrs*70))), t0=performance.now();
      timer=setInterval(()=>{
        const u=clamp((performance.now()-t0)/dur,0,1);
        document.getElementById("pa").textContent=Math.round(from+yrs*u);
        document.getElementById("pbar").style.width=(u*100)+"%";
        if(u>=1){clearInterval(timer);
          if(fact){const txt=fact();G.log.push({a:to,f:()=>"📊 "+fact()});
            document.getElementById("pfact").innerHTML=`<div class="fact"><span>${UI.fact_label[LI]}</span>${txt}</div>`;
            setTimeout(go,sp(3200));

      ${cur.ch.map((c,i)=>{

function choose(i){
  const e=cur.e, ch=cur.ch[i], prevS={...G.s};
  applyFx(ch.fx);
  if(ch.job) G.job=ch.job;
  let res=ch.res, died=false;
  if(ch.risk && luck(G,EV.indexOf(e)*7919)<ch.risk.p(G)){
    applyFx(ch.risk.fx); res=ch.risk.res||res;
    if(ch.risk.die){ G.lifespan=Math.min(G.lifespan,G.age+(rnd()<0.5?0:1)); G.cause=ch.risk.die; died=true; }
  }

  const sum=Object.values(ch.fx||{}).reduce((s,v)=>s+Math.abs(v),0)+(died?30:0)+(ch.job?25:0);
  G.bio.push({a:age,l:lab,imp:sum,job:!!ch.job});

  G.hist.push({a:G.age,...G.s});

    ["LINE","https://social-plugins.line.me/lineit/share?url="+enc(url)+"&text="+enc(txt)],
    ["Threads","https://www.threads.net/intent/post?text="+enc(txt+" "+url)],
    ["Weibo","https://service.weibo.com/share/share.php?url="+enc(url)+"&title="+enc(txt)]
  ];
  show(`
    <h1>${UI.end_h[LI]}</h1>
    <div class="card"><h2>${UI.end_s[LI]}</h2><div class="big">${title}</div>
      <p style="color:var(--soft)">${ui("end_p",{place:place(G.c),sex,cause:info.causeTxt,age,cmp:info.cmp})}</p></div>
    ${statsHTML()}
    <div class="card"><h2>${UI.curve_h[LI]}</h2>${curveSVG()}</div>
    <div class="card"><h2>${UI.card_h[LI]}</h2>
      <canvas id="card" width="1080" height="1350"></canvas>
      <div class="row" style="margin-top:10px"><button class="btn" id="savecard">${UI.save[LI]}</button><button class="btn" id="copy">${UI.copy[LI]}</button></div></div>
    <div class="card"><h2>${UI.share_h[LI]}</h2><p style="margin-top:0;color:var(--soft)">${UI.share_p[LI]}</p>
      ${navigator.share?`<button class="btn primary" id="native">${UI.share_native[LI]}</button>`:""}
      <div class="sns">${links.map(([n,u])=>`<a class="btn" target="_blank" rel="noopener" href="${u}">${n}</a>`).join("")}</div></div>
    ${lockedHTML()}
    <div class="card"><h2>${UI.path_h[LI]}</h2><ul class="log">${G.log.map(x=>`<li><span>${ui("age_n",{n:x.a})}</span>${x.f()}</li>`).join("")}<li><span>${ui("age_n",{n:age})}</span>${UI.died[LI]}</li></ul></div>
    ${srcHTML()}
    <button class="btn primary" id="again">${UI.again[LI]}</button>
    <p class="note">${UI.again_p[LI]}</p>`,()=>{
    document.getElementById("again").onclick=()=>renderStart();
    document.getElementById("savecard").onclick=saveCard;
    const nb=document.getElementById("native");
    if(nb) nb.onclick=()=>navigator.share({title:UI.title[LI],text:txt,url}).catch(()=>{});
    document.getElementById("copy").onclick=async e=>{
      const full=txt+"\n"+url;
      try{await navigator.clipboard.writeText(full);e.target.textContent=UI.copied[LI]}catch(_){prompt(UI.copy[LI],full)}
    };
    drawCard(info);
  },{type:"map",mode:"hl",iso:G.c[0],cap:""});
}

/* ---------- 자서전 카드 ---------- */
function bioLines(info){
  const key=G.bio.slice().sort((a,b)=>b.imp-a.imp).slice(0,G.job?2:3).sort((a,b)=>a.a-b.a);
  const lines=[]; if(G.name) lines.push("· "+G.name);
  lines.push(ui("card_born",{place:place(G.c),tier:UI.tiers[G.famTier][LI]}));
  if(G.job) lines.push(ui("card_job",{job:G.job.n[LI]}));
  for(const k of key) if(!k.job) lines.push(ui("card_choice",{a:k.a,l:tr(k.l,G)}));
  lines.push(ui("card_end",{age:info.age,cause:info.causeTxt}));
  return lines;
}
function wrapText(ctx,text,w){
  const tokens=LANG==="en"?text.split(/(\s+)/):Array.from(text);
  const out=[];let line="";
  for(const t of tokens){
    if(ctx.measureText(line+t).width>w&&line.trim()){out.push(line.trimEnd());line=t.trim()?t:""}
    else line+=t;
  }
  if(line.trim()) out.push(line.trimEnd());
  return out;
}
function drawCard(info){
  const cv=document.getElementById("card"); if(!cv) return;
  const W=1080,H=1350,ctx=cv.getContext("2d");
  const FF='"Noto Serif KR","Noto Serif JP","Noto Serif SC","Noto Sans KR","Hiragino Mincho ProN","Songti SC","Malgun Gothic",serif';
  ctx.fillStyle="#f5f2ea";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#a8742a";ctx.lineWidth=4;ctx.strokeRect(48,48,W-96,H-96);
  ctx.fillStyle="#a8742a";ctx.font=`500 34px ${FF}`;
  ctx.fillText(G.daily?ui("card_daily",{d:G.date}):UI.title[LI],96,140);
  ctx.fillStyle="#1f1d19";ctx.font=`700 68px ${FF}`;
  let y=250; for(const l of wrapText(ctx,info.title,W-192)){ctx.fillText(l,96,y);y+=88}
  ctx.font=`400 44px ${FF}`;ctx.fillStyle="#3b372f";y+=40;
  for(const ln of bioLines(info)){ for(const l of wrapText(ctx,ln,W-192)){ctx.fillText(l,96,y);y+=68} y+=22 }
  ctx.strokeStyle="#ddd6c6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(96,H-250);ctx.lineTo(W-96,H-250);ctx.stroke();
  ctx.fillStyle="#8c8578";ctx.font=`400 30px ${FF}`;
  ctx.fillText(ui("card_foot",{n:G.locked.length,age:info.age}),96,H-190);
  ctx.fillText(UI.card_sub[LI],96,H-140);
  ctx.fillText((location.host||"gyeoltaro.github.io/gyeoltaro"),96,H-96);
}
function saveCard(){
  const cv=document.getElementById("card");
  cv.toBlob(async b=>{
    const f=new File([b],"my-life.png",{type:"image/png"});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],text:shareText(),url:shareURL()}); return; } }catch(_){}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="my-life.png";a.click();
  });
}

/* ---------- 시작 ---------- */
(function init(){
  const q=new URLSearchParams(location.search).get("l");
  const saved=store.get("lang");
  const nav=(navigator.language||"ko").toLowerCase();
  const guess=nav.startsWith("ko")?"ko":nav.startsWith("ja")?"ja":nav.startsWith("zh")?"zh":nav.startsWith("en")?"en":"ko";
  applyStyle(); view=renderStart; setLang(LANGS.some(x=>x[0]===q)?q:saved||guess,true);
})();
</script>
