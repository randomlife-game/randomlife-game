<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>방문 통계 · 랜덤인생게임</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#222;--muted:#777;--line:#e6e0d6;--bar:#d9774b}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--card:#222127;--ink:#eee;--muted:#999;--line:#34323a;--bar:#e58a5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
p.note{color:var(--muted);margin:0 0 20px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.sum .card b{display:block;font-size:24px}
.sum .card span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px;margin:4px 0}
.row i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bar);display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media (max-width:520px){.sum .card b{font-size:20px}}
</style>
</head>
<body>
<main>
<h1>방문 통계</h1>
<p class="note">날짜는 한국 시간 기준이에요. 방문은 첫 화면이 열린 횟수, 시작은 태어나기를 누른 횟수, 완료는 끝까지 한 판을 한 횟수예요. 이 통계는 2026-10-13부터 모았어요(완료 수는 그 전부터).</p>
<div class="seg" id="seg"><button data-n="1">오늘</button><button data-n="7" aria-pressed="true">7일</button><button data-n="30">30일</button></div>
<div class="sum" id="sum"></div>
<div class="grid">
  <div class="card"><h2>어디서 왔나 <small style="font-weight:400;color:var(--muted)">최근 30일</small></h2><div id="ref"></div></div>
  <div class="card"><h2>나라 <small style="font-weight:400;color:var(--muted)">최근 30일</small></h2><div id="country"></div></div>
  <div class="card"><h2>언어 <small style="font-weight:400;color:var(--muted)">최근 30일</small></h2><div id="lang"></div></div>
</div>
<div class="card"><h2>날짜별</h2><table><thead><tr><th>날짜</th><th>방문</th><th>시작</th><th>완료</th></tr></thead><tbody id="days"></tbody></table></div>
</main>
<script>
const URL_STATS="https://randomlife-plays.kkjlg.workers.dev/stats";
const REF_NAMES={direct:"직접 입력·북마크·앱",share:"공유 링크",other:"기타"};
const LANG_NAMES={ko:"한국어",en:"영어",ja:"일본어",zh:"중국어",other:"기타"};
let regionName=c=>c;
try{const dn=new Intl.DisplayNames(["ko"],{type:"region"});regionName=c=>c==="??"?"알 수 없음":(dn.of(c)||c);}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=null;
function bars(id,list,name){
  const max=Math.max(1,...list.map(x=>x.n));
  document.getElementById(id).innerHTML=list.length?list.slice(0,12).map(x=>`<div class="row"><span>${esc(name(x.key))}</span><b>${x.n.toLocaleString()}</b><i style="width:${Math.max(2,x.n/max*100)}%"></i></div>`).join(""):`<p class="note">아직 없어요</p>`;
}
function draw(n){
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===n)));
  const cut=new Date(Date.now()+9*3600e3-(n-1)*864e5).toISOString().slice(0,10), days=DATA.days.filter(d=>d.day>=cut), t={visit:0,start:0,done:0};
  days.forEach(d=>{t.visit+=d.visit;t.start+=d.start;t.done+=d.done});
  document.getElementById("sum").innerHTML=[["방문",t.visit],["시작",t.start],["완료",t.done]].map(([k,v])=>`<div class="card"><b>${v.toLocaleString()}</b><span>${k}</span></div>`).join("");
}
fetch(URL_STATS,{cache:"no-store"}).then(r=>r.json()).then(d=>{
  DATA=d;
  bars("ref",d.ref,k=>REF_NAMES[k]||k);
  bars("country",d.country,regionName);
  bars("lang",d.lang,k=>LANG_NAMES[k]||k);
  document.getElementById("days").innerHTML=d.days.map(x=>`<tr><td>${x.day}</td><td>${x.visit}</td><td>${x.start}</td><td>${x.done}</td></tr>`).join("");
  document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>draw(+b.dataset.n));
  draw(7);
}).catch(()=>{document.getElementById("sum").innerHTML=`<p class="note">통계를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>`});
</script>
</body>
</html>
